document.addEventListener('click',e=>{const edge=e.target.closest('[data-edge]');if(edge){const[a,b]=edge.dataset.edge.split(':'),from=graphNodes.find(n=>n.id===a),to=graphNodes.find(n=>n.id===b),rel=graphEdges.find(r=>r[0]===a&&r[1]===b)?.[2]||'影响待核实';openDialog(dialogShell(`${from?.title||a} → ${to?.title||b}`,'关系有方向，依据与状态跟随这一条关系。',`<dl class="metadata"><dt>关系类型</dt><dd>${rel}</dd><dt>来源 / 图谱</dt><dd>r8 / g7</dd><dt>成立范围</dt><dd>当前命题与对应版本</dd></dl><div class="quote">${rel.includes('待')?'当前证据尚不足，保留为待查关系。':a==='order'?'业务目录 §2 的功能归属陈述是此包含关系的示例依据。':b==='test'?'测试定义引用取消订单行为；当前没有关联执行记录。':b==='api'?'API-024 绑定 OrderService.cancel；业务解释引用需求 §3.2。':'需求 §3.2 是取消订单规则的原文引用。'}</div>`));return}const node=e.target.closest('[data-node]');if(node){selectNode(node.dataset.node);return}const target=e.target.closest('[data-action]');if(target)action(target.dataset.action)});
document.addEventListener('submit',e=>{if(e.target.id!=='source-form')return;e.preventDefault();const input=document.getElementById('source-url'),error=document.getElementById('source-error'),url=input.value.trim(),name=document.getElementById('source-name').value.trim();let valid=false;try{const u=new URL(url);valid=u.protocol==='https:'&&Boolean(u.hostname)&&u.pathname!=='/'}catch{}if(!valid){input.setAttribute('aria-invalid','true');input.setAttribute('aria-describedby','source-error');error.hidden=false;error.textContent='请输入完整 HTTPS 仓库地址，例如 https://github.com/team/order-service。';input.focus();return}if(!name){const el=document.getElementById('source-name');el.setAttribute('aria-invalid','true');el.setAttribute('aria-describedby','source-error');error.hidden=false;error.textContent='请填写来源名称，方便在版本列表中辨认。';el.focus();return}state.sources.unshift({name,url});state.search='';persist();closeDialog();go('sources');toast('来源草稿已保存到本机样稿，未连接真实仓库。')});
document.addEventListener('input',e=>{if(e.target.id==='source-search'){state.search=e.target.value;document.getElementById('source-rows').innerHTML=sourceRows()}if(e.target.id==='command-input'){commandIndex=0;renderCommands(e.target.value)}if(e.target.id==='review-note'){state.reviewNote=e.target.value;persist()}});
document.addEventListener('change',e=>{if(e.target.id==='only-human'){state.onlyHuman=e.target.checked;render()}if(e.target.id==='capability-switch'){state.capability=e.target.checked;persist();render()}if(e.target.id==='graph-version'){e.target.selectedIndex=0;toast('当前样稿只提供 g7；历史版本选择的产品规则见设计总纲。')}});
document.addEventListener('keydown',e=>{if(e.target.matches('[role=tab]')&&['ArrowLeft','ArrowRight','Home','End'].includes(e.key)){e.preventDefault();const tabs=[...e.target.closest('[role=tablist]').querySelectorAll('[role=tab]')];let i=tabs.indexOf(e.target);i=e.key==='Home'?0:e.key==='End'?tabs.length-1:(i+(e.key==='ArrowRight'?1:-1)+tabs.length)%tabs.length;tabs[i].focus();return;}if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='k'){e.preventDefault();command();return}if(e.target.id==='command-input'){if(e.key==='ArrowDown'||e.key==='ArrowUp'){e.preventDefault();commandIndex=(commandIndex+(e.key==='ArrowDown'?1:-1)+commandMatches.length)%Math.max(1,commandMatches.length);renderCommands(e.target.value)}if(e.key==='Enter'&&!e.isComposing&&commandMatches[commandIndex]){e.preventDefault();action('command-go:'+commandMatches[commandIndex][0])}}if((e.key==='Enter'||e.key===' ')&&e.target.matches('[data-node],[data-edge]')){e.preventDefault();e.target.dispatchEvent(new MouseEvent('click',{bubbles:true}))}if(e.key==='Escape'&&!dialog.open){if(document.getElementById('sidebar').classList.contains('open')){document.getElementById('sidebar').classList.remove('open');document.getElementById('scrim').hidden=true}else if(state.selected){state.selected=null;render()}}});
document.getElementById('scrim').addEventListener('click',()=>{document.getElementById('sidebar').classList.remove('open');document.getElementById('scrim').hidden=true});
document.getElementById('theme-toggle').addEventListener('click',()=>{state.theme=state.theme==='light'?'dark':'light';applyTheme();persist()});
function attachGraphPan(){const svg=document.getElementById('graph-svg');if(!svg)return;let drag=null;svg.addEventListener('pointerdown',e=>{if(e.target.closest('[data-node],[data-edge]'))return;drag={x:e.clientX,y:e.clientY,px:state.pan.x,py:state.pan.y};svg.setPointerCapture(e.pointerId)});svg.addEventListener('pointermove',e=>{if(!drag)return;const scale=785/svg.getBoundingClientRect().width;state.pan={x:drag.px+(e.clientX-drag.x)*scale,y:drag.py+(e.clientY-drag.y)*scale};document.getElementById('graph-transform').setAttribute('transform',`translate(${state.pan.x} ${state.pan.y}) translate(392 295) scale(${state.zoom}) translate(-392 -295)`) });svg.addEventListener('pointerup',()=>drag=null);svg.addEventListener('pointercancel',()=>drag=null)}
function route(){const view=location.hash.slice(1).split('?')[0];state.view=['overview','sources','evidence','graph','impact','settings','components'].includes(view)?view:'overview';document.getElementById('scrim').hidden=true;render();window.scrollTo(0,0)}
window.addEventListener('hashchange',route);applyTheme();route();
window.__traqenDemo={state,render,go,icon};

main{max-width:100%;border:0;padding:32px} .layout{display:block}</style><main><div class=&quot;intro-label&quot;>瓷白与石墨 · 整体体验提案</div><h1>F005 · Traqen 整体体验与前端设计总纲</h1><aside class=&quot;callout&quot;>V2 完整评审提案 · 2026-09-15。效果图与交互样稿均使用构造数据。本提案尚未写入正式 Feature Spec，也不代表产品功能已经实现。</aside><h2 id=&quot;section-1&quot;>01 · 设计主张</h2><p><strong>把复杂系统的理解过程，做成一个安静、精确、可追溯的工作空间。</strong></p><p>Traqen 是持续理解业务、技术实现和变化影响的专业工具。用户应能快速知道：我在哪个工作区、正在查看哪个版本、这里的结论凭什么成立、下一步能做什么。</p><p>本次选择“瓷白与石墨”：大面积柔和中性背景，不透明的正文面，深浅明确的文字，蓝色只突出选中与主要动作。层次首先由位置、字号和间距建立；边框、阴影和材质只在有分组或空间意义时出现。</p><p>上一版的不足不是缺几个精致组件，而是缺少贯穿页面、任务、状态与细节的统一语言。V2 因此同时重做导航、主要工作面、图谱、表单、列表和状态系统；以同一套组件生成效果图和可操作样稿，减少“设计稿漂亮，实际状态失真”的落差。</p><h3>Apple 风格的取舍</h3><p>借鉴 Apple 对内容与控制层次的区分：导航、浮动控制可以有轻微材质感；长文、代码、表格和图谱节点使用稳定的不透明底色。避免大面积模糊、玻璃叠玻璃和纯装饰反光。该取舍参考 Apple 的 <a href=&quot;https://developer.apple.com/videos/play/wwdc2025/219/&quot; target=&quot;_blank&quot; rel=&quot;noreferrer&quot;>Meet Liquid Glass ↗</a>；它是 Traqen 的设计选择，不宣称复刻原生系统。</p><p>Traqen 采用专业应用的信息密度，保留长中文、版本、证据和权限信息。没有仿 macOS 窗口红黄绿灯，没有 Apple 标志，不要求下载或分发 Apple 字体资产。</p><h3>六条贯穿规则</h3><div class=&quot;table-scroll&quot;><table><tr><th>规则</th><th>页面上的具体体现</th></tr><tr><td>先内容，后装饰</td><td>页面标题明确对象；正文面安静；图谱只强调当前探索路径</td></tr><tr><td>一个任务区，一个主动作</td><td>当前任务只有一个蓝色主按钮；危险操作不充当默认动作</td></tr><tr><td>同一对象保持上下文</td><td>详情在侧面展开；返回保留选择、筛选、滚动与版本</td></tr><tr><td>状态跟着对象出现</td><td>失败、受限、过期和待确认显示在对应行、节点或任务旁</td></tr><tr><td>结论可以回查</td><td>节点和关系均有来源、版本、依据、状态和适用范围</td></tr><tr><td>未知被准确表达</td><td>未提取不等于不存在；测试资产不等于执行通过；分析态不等于人工确认</td></tr></table></div><h2 id=&quot;section-2&quot;>02 · F005 的职责与业务边界</h2><p>建议把 F005 从“总体布局及导航”扩展为<strong>所有前端页面的体验总纲</strong>：负责信息架构、页面模板、视觉基础、组件规范、交互状态、响应式与验收标准。各 Feature 继续决定业务对象、处理流程、权限和数据契约，F005 统一它们的呈现方式。</p><div class=&quot;table-scroll&quot;><table><tr><th>归属</th><th>F005 必须承接的业务事实</th><th>不由 F005 自行改变</th></tr><tr><td>F001 来源真相</td><td>多种来源、材料清单、采集过程、固定身份、可用版本与恢复</td><td>来源冻结规则、准入规则、任务阶段与权限</td></tr><tr><td>F002 确定性事实</td><td>对象、声明、派生事实、确定性关系、依据和缺口</td><td>可提取范围、推导规则和事实身份</td></tr><tr><td>F003 业务图谱</td><td>调查、证据路由、分析态自动入库、例外的人类确认、图谱版本</td><td>证据充分性、业务确认单位、隔离与修复判定</td></tr><tr><td>F004 变更影响</td><td>比较范围、影响路径、判断限制、建议验证</td><td>影响计算和验证执行契约</td></tr><tr><td>F006 能力配置</td><td>全局资产、工作区启用、Agent 授权、运行配置快照</td><td>有效能力求值、认证与执行准入</td></tr></table></div><p><strong>本次以 F003 已确认 V2.0 为准。</strong> 不沿用旧设计“所有业务候选必须人工确认后才可进入图谱”的假设。证据充分的结果可以以 Agent 分析态记录；人工处理规则歧义等例外。人工确认只作用于明确的命题或关系，不能一键批准整张子图。</p><p>来源版本、事实集版本、业务图谱版本是不同身份。示例中 r8、f12、g7 只是便于阅读的显示名，不可用一个通用 version 字段替代。技术提取完成、业务材料已调查、测试已经执行也是三个独立维度。</p><h2 id=&quot;section-3&quot;>03 · 信息架构与导航</h2><h3>主导航</h3><p>左侧导航按用户目的命名，不以 F 编号或内部流水线阶段命名。F 编号出现在研发文档中，不进入日常产品导航。</p><div class=&quot;table-scroll&quot;><table><tr><th>一级入口</th><th>回答的问题</th><th>二级视图 / 页面功能</th><th>常见下一步</th></tr><tr><td>工作区概览</td><td>我现在可以继续做什么？</td><td>继续探索、需要关注、当前版本与依据、近期任务</td><td>回到对象或解决具体阻塞</td></tr><tr><td>来源快照</td><td>我们在理解哪一份材料？</td><td>版本、材料清单、采集记录；添加来源；范围配置</td><td>浏览固定材料 / 恢复采集</td></tr><tr><td>技术证据</td><td>哪些事实可以直接核验？</td><td>对象与事实、关系、覆盖与缺口；代码/原文阅读</td><td>回查依据 / 转到关联业务</td></tr><tr><td>业务图谱</td><td>业务、实现和依据怎样连接？</td><td>业务、实现、覆盖三种投影；调查运行；待确认问题；图/列表</td><td>展开关联 / 阅读依据 / 处理命题</td></tr><tr><td>变更影响</td><td>这次变化可能影响哪里？</td><td>版本比较、影响路径、限制、重验证建议</td><td>回查路径 / 补充执行记录</td></tr><tr><td>设置中心</td><td>谁以什么能力在什么范围工作？</td><td>全局：账号、模型、Skill、MCP；工作区：Agent 设置、能力管理</td><td>修复配置 / 保存并应用</td></tr></table></div><p>侧栏顶部固定品牌与工作区切换；中部为主导航；“最近查看”最多 5 项并允许清空；底部放设置、帮助和当前账号。当前工作区名称旁提供设置快捷入口。切换工作区先处理未保存编辑，再进入目标工作区自己的状态。</p><p>顶部工具栏包含工作区/当前页面上下文、当前固定来源摘要、全局搜索和活动入口。版本切换必须在其所属页面标明是来源、事实集还是业务图谱；不能把顶部来源摘要误当成所有页面的通用版本切换器。</p><h3>导航、Tab 和局部视图的区别</h3><ul><li>主导航改变主要工作目的；浏览器前进/后退有效，页面支持直接打开。</li><li>Tab 改变同一对象或同一任务下的内容域，例如“对象 / 关系 / 缺口”。</li><li>分段控件改变同一组数据的投影或表现，例如“业务 / 实现 / 覆盖”和“图 / 列表”。</li><li>临时详情不创建新的主导航项。需要分享、长时间编辑或跨对象比较时，提供完整详情页。</li><li>查询、筛选、排序、选中对象和版本应可序列化到 URL；个人密度偏好可存本地；敏感原文和凭据不进入 URL。</li><li>返回列表保留查询与位置；切换版本不偷偷复用旧确认。无法定位历史对象时解释原因，并保留原版本入口。</li></ul><p>建议路由结构为 workspace → feature → object，参数分别承载来源、事实集、图谱版本。具体 URL 在实现时与路由真相源对齐；本样稿的 hash 是演示导航，不是后端契约。</p><h2 id=&quot;section-4&quot;>04 · 页面模板与主要工作流</h2><h3>A. 工作区概览</h3><p>使用“继续工作 + 需要关注 + 当前依据”结构。恢复上次上下文优先于大数字；最多展示 3–5 条需要行动的事项。新用户空态解释首个来源的建立方式；已有工作区不重复展示入门营销内容。</p><p>当前设计的引导面板连接“取消订单”到 API 与需求原文。它说明 Traqen 的价值，同时提供真实进入对象的动作。统计仅作辅助，必须能解释统计范围。</p><h3>B. 来源快照</h3><p>冻结版本与进行中的新采集分区展示。r9 采集中断时，r8 仍为可用的固定来源。进度只使用已建立清单后的真实分母；枚举前显示当前阶段与已发现数量，不伪造百分比。</p><p>来源工作流承接 F001 的阶段，不重新发明处理状态。可读层次为：来源与范围 → 预检 → 材料枚举和固定清单 → 采集校验 → 缺口处置 → 来源冻结。正式阶段名称、转换条件以 F001 为准，紧凑进度条只是摘要。</p><p>重新连接显示受影响来源、已保留内容、下一步核对什么。身份或清单改变时先展示差异；不能直接继承旧任务进度。来源冻结成功后提供后续入口，但不自动启动技术提取和业务调查。</p><h3>C. 技术证据</h3><p>采用对象目录、主要阅读面和按需详情结构。默认显示声明及定位；派生事实必须标出推导规则、前提和原始输入。API 树是可选投影，不代表全部技术证据。</p><p>代码视图保留语言、路径、行号、固定来源和定位范围；选中事实时只高亮相关行。复制代码与复制引用分开。权限不足时不能渲染原文预览；对象目录不能用空白冒充“没有内容”。</p><h3>D. 业务图谱</h3><p>默认从某个业务领域或搜索命中对象开始，逐步展开。业务、实现、覆盖使用同一批带身份的数据；切换投影保留当前对象，并解释被筛选隐藏的部分。</p><p>桌面右侧检查器包含“概览 / 证据 / 活动”，不把所有信息挤进节点。关系本身可选中并回查依据。图谱和逐行列表都必须可以完成对象阅读、关系阅读和状态筛选。</p><h3>E. 变更影响</h3><p>固定显示比较两端及其身份、分析范围和时间。区分“有依据的影响路径”“可能影响”“未知”，每项都给出依据和限制。测试建议明确标注未执行；只有有关联运行、环境、版本与结果时，才呈现执行结论。</p><p>此页面提供建议，不因为图中缺边或覆盖未知就自动阻断合并、部署或发布。</p><h3>F. 设置中心</h3><p>顶层先选择全局或具体工作区；全局拥有资产目录，工作区启用能力，Agent 获得显式授权。两层能力清单不能混成一个总开关。</p><p>一个主 Agent 与至少一个子 Agent 是当前业务约束。模型绑定显示 CLI 可用性和认证摘要；不制造直接 API 执行入口。Ready、Incomplete、Needs attention 必须能展开原因和跳到修复位置。</p><p>编辑值、已保存草稿、已应用配置、运行使用的快照分别可辨。应用前展示作用范围；现有运行保持启动配置。不能通过“保存成功”的 toast 暗示已经对运行生效。</p><h2 id=&quot;section-5&quot;>05 · 视觉基础与设计 Token</h2><p>以下数值是 Traqen 的实现基准提案；不冒充 Apple 官方尺寸。统一使用语义 token，不允许页面临时选近似灰色和蓝色。</p><h3>颜色</h3><div class=&quot;table-scroll&quot;><table><tr><th>语义</th><th>浅色</th><th>深色</th><th>使用边界</th></tr><tr><td>页面背景</td><td>#F5F5F7</td><td>#16171B</td><td>大面积画布</td></tr><tr><td>内容表面</td><td>#FFFFFF</td><td>#222329</td><td>阅读面、表格、节点</td></tr><tr><td>次级表面</td><td>#F0F1F4</td><td>#292B33</td><td>分段底板、轻分组</td></tr><tr><td>导航底色</td><td>#EBEDF1</td><td>#1C1D23</td><td>侧栏层次</td></tr><tr><td>主要文字</td><td>#1D1D1F</td><td>#F2F3F6</td><td>标题、正文、重要值</td></tr><tr><td>次要文字</td><td>#626570</td><td>#B3B7C3</td><td>说明和次要字段</td></tr><tr><td>元信息</td><td>#6b6f7b</td><td>#9A9EAB</td><td>非关键时间、辅助信息</td></tr><tr><td>装饰分割线</td><td>#E1E3E8</td><td>#3C3E48</td><td>不能单独承担交互控件识别</td></tr><tr><td>控件边界</td><td>#898F9B</td><td>#72788A</td><td>输入框、选择框的必要轮廓</td></tr><tr><td>交互蓝</td><td>#0066CC</td><td>#84BBFF</td><td>主要操作、选中、链接、焦点</td></tr><tr><td>蓝色浅底</td><td>#E8F1FF</td><td>#263B59</td><td>选中背景</td></tr><tr><td>成立 / 可用</td><td>#28714B</td><td>#8DCEAC</td><td>与文字状态一起出现</td></tr><tr><td>注意 / 待处理</td><td>#945C05</td><td>#EAC283</td><td>需操作、有歧义</td></tr><tr><td>分析 / 类型辅助</td><td>#7054AD</td><td>#C2ACEF</td><td>Agent 分析、技术对象类型</td></tr><tr><td>错误 / 危险</td><td>#B43232</td><td>#FFAAA4</td><td>错误说明、破坏性操作</td></tr></table></div><p>状态使用对应低饱和浅底；浅底不承载唯一语义。深色主按钮使用浅蓝底与深色字，不能直接把浅色白字方案反转。</p><h3>字体与排版</h3><p>系统字体栈：-apple-system、BlinkMacSystemFont、PingFang SC、Segoe UI、Noto Sans SC、sans-serif。数字和版本使用 tabular-nums；代码使用 ui-monospace、Menlo、Consolas。中英文混排自然，中文正文不使用负字距。</p><div class=&quot;table-scroll&quot;><table><tr><th>层级</th><th>字号 / 行高</th><th>字重</th><th>使用</th></tr><tr><td>页面标题</td><td>32 / 40；窄屏 28 / 36</td><td>600–650</td><td>每页一个 h1</td></tr><tr><td>重点叙述</td><td>28 / 38</td><td>600</td><td>概览中的继续工作区域</td></tr><tr><td>区域标题</td><td>20 / 28</td><td>600</td><td>大区域、主要面板</td></tr><tr><td>小标题</td><td>15 / 22</td><td>600</td><td>行标题、字段分组</td></tr><tr><td>阅读正文</td><td>15 / 27</td><td>400</td><td>需求原文、解释、决定说明</td></tr><tr><td>工作界面正文</td><td>13 / 20</td><td>400–500</td><td>导航、列表、按钮</td></tr><tr><td>关键辅助与状态</td><td>12 / 18</td><td>400–550</td><td>版本、状态、字段帮助</td></tr><tr><td>非关键微文案</td><td>11 / 16</td><td>400</td><td>稀疏元信息，不放错误或核心判断</td></tr></table></div><p>正文连续阅读宽度建议 64–76 个拉丁字符等效宽度。长标题最多两行，保留完整阅读入口。表格单元格截断时可展开，不仅依赖鼠标悬停。重要 ID 可换行或复制，不能不可恢复地省略。</p><h3>间距、形状与层级</h3><ul><li>间距阶梯：4、8、12、16、20、24、32、40、48、64。4 是基础步长。</li><li>页面边距：桌面 32–40；紧凑桌面 24；手机 18–20。区块间距 24–32，区块内部 16–24。</li><li>圆角：状态 6；输入/按钮 9；节点 11–12；面板 16；移动详情 20。无需把每个矩形变成胶囊。</li><li>边框通常 1px；焦点环 3px + 3px 外间隙；选中图谱节点 2px 并配浅色外圈。</li><li>阴影分 content、floating、modal 三层；内容层接近无阴影，浮层可辨且柔和。</li><li>层级顺序：正文 → 固定导航 → 浮动检查器 → 遮罩 → 对话框/菜单 → toast。z-index 由统一层级表控制。</li><li>图标默认 18px、1.5–1.75px 线宽；导航和操作优先同一图标集。图标有明确文字或可访问名称；不以 emoji 代替核心图标。</li></ul><h2 id=&quot;section-6&quot;>06 · 页面尺寸、密度与响应式</h2><div class=&quot;table-scroll&quot;><table><tr><th>宽度</th><th>导航</th><th>内容与详情</th><th>表格 / 图谱</th></tr><tr><td>≥1680</td><td>244px 侧栏</td><td>阅读区可限宽；分析画布伸展</td><td>检查器 320–360px，允许并列比较</td></tr><tr><td>1280–1679</td><td>224px 左右</td><td>页面边距 32–34px</td><td>图谱 + 约 300px 检查器</td></tr><tr><td>1024–1279</td><td>200px</td><td>压缩次要间距，不缩核心文字</td><td>检查器约 270–300px；必要时覆盖</td></tr><tr><td>768–1023</td><td>184px 或用户主动折叠</td><td>单列工作面；检查器临时覆盖</td><td>工具条换行；重点列优先</td></tr><tr><td>390–767</td><td>抽屉导航</td><td>单列，详情底部展开或独立页</td><td>默认列表；用户可切图；表格局部横滚</td></tr><tr><td>320–389</td><td>抽屉导航</td><td>保留核心阅读和操作</td><td>不以整体缩放桌面页面适配</td></tr></table></div><p>支持舒适和紧凑两种桌面密度。舒适行为 52px，含说明的双行为 72px；紧凑模式单行 40px。触控场景保持至少 44px 的目标尺寸或等效命中区域。控件视觉高度与命中区域是两个属性。</p><p>分析画布可二维平移，页面其余区域不能依赖横向滚动阅读正文。隐藏非核心列时提供列配置或详情，不删除状态、对象名称和恢复动作。图谱在窄屏默认逐行阅读，而不是把七个节点缩成不可读的小点。</p><h2 id=&quot;section-7&quot;>07 · 前端组件规范</h2><h3>共同契约</h3><p>基础组件统一覆盖 default、hover、pressed、focus-visible、disabled、loading、invalid、readonly；不是每个组件都机械拥有全部状态，未适用的状态明确排除。</p><p>组件不得在内部猜权限、伪造成功或自行改变业务版本。异步组件接收可区分的加载、失败、重试和完成状态。危险动作必须知道对象和后果；普通导航和可撤销轻操作不重复确认。</p><div class=&quot;table-scroll&quot;><table><tr><th>组件</th><th>外观 / 解剖</th><th>交互与状态标准</th></tr><tr><td>AppShell</td><td>工作区侧栏 + 顶部上下文 + 主内容 + 浮层宿主</td><td>导航稳定；窄屏抽屉可 Esc/点击遮罩关闭；焦点回触发器</td></tr><tr><td>WorkspaceSwitcher</td><td>名称、简短标识、当前项、搜索</td><td>列出可访问范围；未保存编辑先处置；目标不可用解释原因</td></tr><tr><td>NavItem</td><td>图标、名称、可选数量、当前态</td><td>aria-current；计数必须有对象含义；活动页不能只靠颜色</td></tr><tr><td>PageHeader</td><td>h1、说明、上下文、当前任务动作</td><td>只有一个主动作；标题和动作窄屏换行不互挤</td></tr><tr><td>Button</td><td>primary、secondary、ghost、destructive；默认 36px</td><td>loading 保宽并禁重复提交；可访问名称稳定；禁用原因邻近可读</td></tr><tr><td>IconButton</td><td>18px 图标，36px 桌面目标</td><td>aria-label；tooltip 仅辅助；触控目标 44px</td></tr><tr><td>Link / TextButton</td><td>链接表示目的地，按钮表示操作</td><td>用正确语义；外部跳转明确；不把整行和内部按钮嵌套</td></tr><tr><td>TextField</td><td>可见 label、输入区、帮助、错误</td><td>label 绑定 id；错误用 aria-invalid/aria-describedby；保留输入</td></tr><tr><td>TextArea</td><td>label、多行输入、长度/保存反馈</td><td>自适应或手动调整；换行不提交；中文输入法组合态不触发快捷提交</td></tr><tr><td>SearchField</td><td>搜索图标、输入、清空、结果反馈</td><td>清空可键盘操作；无结果与尚未输入不同；异步结果不抢焦点</td></tr><tr><td>Select</td><td>有限选项、当前值、展开指示</td><td>优先原生语义；占位不当默认已选；不可选项带原因</td></tr><tr><td>Combobox</td><td>可输入值 + 候选列表 + 分组/说明</td><td>上下键移动，Enter 选择，Esc 返回；加载/无结果/失败清晰</td></tr><tr><td>Menu</td><td>动作列表、分组、快捷键、危险项</td><td>用于执行动作，不代替数据选择器；方向键、Home/End、Esc 可用</td></tr><tr><td>SegmentedControl</td><td>同一面板的 2–4 种互斥投影</td><td>当前态可辨；不装过多长标签；响应式保持完整命名</td></tr><tr><td>Tabs</td><td>内容域标签、当前下划线、可选数量</td><td>tablist/tab/tabpanel 关联；方向键和 Home/End；自动激活仅用于低延迟内容</td></tr><tr><td>Checkbox</td><td>独立多选、全选/部分选中</td><td>部分选中用 mixed；全选明确是当前页还是全部筛选结果</td></tr><tr><td>RadioGroup</td><td>互斥选项、每项解释</td><td>fieldset/legend 或等价名称；方向键可选；默认值必须有业务依据</td></tr><tr><td>Switch</td><td>开/关能力或偏好，旁有作用说明</td><td>即时生效与编辑草稿明确区分；失败恢复原值并说明</td></tr><tr><td>StatusBadge</td><td>文案 + 小符号 + 低饱和底</td><td>字面状态是权威；类型/确认/运行状态不同维度不得共用一个枚举</td></tr><tr><td>Tooltip</td><td>简短辅助解释</td><td>hover 与 focus 均可触发；可 Esc 关闭；不用来承载唯一关键说明</td></tr><tr><td>Popover</td><td>临时信息或轻编辑</td><td>锚定触发器；边缘自动避让；关闭后归还焦点</td></tr><tr><td>Dialog / Sheet</td><td>标题、作用对象、正文、动作</td><td>焦点约束、Escape、返回焦点；破坏性操作默认焦点在安全动作</td></tr><tr><td>Inspector</td><td>对象身份、状态、说明、证据、活动</td><td>选择对象更新内容；独立滚动；关闭不丢画布位置；可打开完整详情</td></tr><tr><td>EmptyState</td><td>场景说明 + 下一步</td><td>首次空白、筛选无结果、权限受限、加载失败分别设计</td></tr><tr><td>InlineNotice</td><td>对象旁的原因与恢复动作</td><td>阻塞不能只发 toast；读屏播报不重复刷屏</td></tr><tr><td>Toast</td><td>轻量成功反馈与可选撤销</td><td>不承担关键失败与长期任务状态；不遮挡主动作</td></tr><tr><td>Skeleton / Progress</td><td>对应真实布局 / 阶段和已知进度</td><td>无分母用不确定进度；减少动态模式停掉闪烁</td></tr><tr><td>DataTable / List</td><td>对象、状态、证据、版本、操作</td><td>排序、筛选、分页、选择范围、空/错/刷新状态统一</td></tr><tr><td>TreeView</td><td>层级、展开标识、名称、状态</td><td>方向键折叠展开；保留选择；长目录按需加载并有列表检索替代</td></tr><tr><td>CodeViewer / EvidenceQuote</td><td>来源、路径、范围、原文、引用动作</td><td>原文与解释分区；复制可定位引用；受限内容不得预加载泄露</td></tr><tr><td>GraphCanvas / GraphNode / GraphEdge</td><td>图形浏览、节点类型、关系方向、证据入口</td><td>详见第 09 节；图与列表同一数据和状态来源</td></tr><tr><td>VersionSelector</td><td>版本身份、时间、可用性、当前使用</td><td>三类版本各自标注；切换前处置未保存编辑；失效对象不静默替换</td></tr></table></div><h3>输入和校验细则</h3><p>提交时先做字段校验，再提交请求；服务端业务校验仍是最终依据。字段在首次离焦或提交后提示错误，之后可以及时清除已修正错误；不要在中文尚未输入完时显示红色错误。</p><p>多字段错误在表单顶部给摘要并可跳到字段，同时各字段保留具体修正方式。错误信息包含“什么不满足”和“怎么修正”，避免只写“非法参数”。失败保留已有内容；密码、令牌等敏感字段按安全要求处理，不进入诊断正文。</p><p>长选项显示完整名称与作用域，支持键盘检索。异步 Combobox 防止旧请求覆盖新查询结果。选择项被权限或配置变化移除时显示失效项与替换操作，不自动悄悄选择第一项。键盘行为以 <a href=&quot;https://www.w3.org/WAI/ARIA/apg/patterns/combobox/&quot; target=&quot;_blank&quot; rel=&quot;noreferrer&quot;>WAI-ARIA Combobox Pattern ↗</a> 为实现依据。</p><h2 id=&quot;section-8&quot;>08 · 列表与信息密度</h2><p>默认列顺序：对象 → 最关键状态 → 依据/限制 → 版本或更新时间 → 行动作。多个状态维度可以分列，但优先展示影响当前判断的一项。数字右对齐，名称左对齐，时间使用一致格式并能查看完整时间。</p><p>排序表头提供方向与 aria-sort；筛选条件在工具条可见；“清空筛选”只清查询，不删除数据。分页保留总量定义，未知总量不用假数字。后台刷新保留旧列表并标记刷新中，失败不清空已知结果。</p><p>仅勾选后出现批量操作条，并明确“已选当前页 N 项”或“全部匹配 M 项”。不允许跨版本、跨工作区悄悄继承选择。批量动作仅用于业务允许的同质操作，绝不把人工确认命题扩大成批量批准图谱。</p><p>长列表可虚拟化，但读屏与键盘定位必须可用；必要时提供分页模式。重要单元格不能因虚拟化失去标签。表格加载、空态、无结果、部分失败、权限不足均提供同一套可复用骨架和提示。</p><h2 id=&quot;section-9&quot;>09 · 图谱专属规范</h2><h3>视觉语法</h3><div class=&quot;table-scroll&quot;><table><tr><th>维度</th><th>表达方式</th><th>禁止混淆</th></tr><tr><td>对象类型</td><td>图标 + 类型标签 + 辅助色</td><td>蓝色业务、紫色技术、绿色文档、琥珀测试仅为类型辅助</td></tr><tr><td>结论状态</td><td>明确文字：Agent 分析、人工确认、待调查、需要确认、隔离</td><td>不能把所有绿色节点解释为人工认可</td></tr><tr><td>关系语义</td><td>有方向的箭头 + 动词标签</td><td>双向查询不把“调用”“包含”变成无向关系</td></tr><tr><td>关系状态</td><td>实线/虚线 + 文字 + 详情</td><td>虚线表示待查；不能只靠虚实线承载唯一语义</td></tr><tr><td>选中</td><td>2px 强边界 + 淡色外圈 + 一跳高亮</td><td>不改变原始业务状态</td></tr><tr><td>受限 / 失效</td><td>占位对象 + 原因 + 修复或回查入口</td><td>不以删除节点制造“没有关系”的假象</td></tr></table></div><p>节点首行是对象名，辅助行是当前状态与依据概况；长标题允许两行。API 路径、源码位置等细节在检查器阅读。相同节点类型和尺寸档位全图一致；节点密度变化有离散档位，不任意缩小文字。</p><p>边的点击命中区域应比可见线宽更宽，并支持键盘访问。小范围图可显示边标签，大范围图只显示焦点附近标签；不能通过隐藏标签改变关系语义。交叉尽量减少，循环关系可以存在并应保持方向。</p><h3>探索过程</h3><ol><li>从领域、搜索结果或变更路径进入，初次只显示可读的局部图。</li><li>选中节点时保留位置并打开检查器；高亮相关一跳，其他节点适度减弱但仍可辨。</li><li>显式“展开一跳关联”追加邻居；显示新增数量、隐藏条件和可撤销展开。</li><li>大图先聚合再展开；展开不应让整张图随机重排。</li><li>平移、缩放、适应画布、返回上一探索位置都提供按钮；拖动不是唯一操作方法。</li><li>开启筛选后显示条件；当前对象被筛掉时提示并允许恢复条件。</li><li>转成列表后保留对象、关系、来源和状态；手机默认进入此模式。</li><li>深层阅读可打开完整详情，返回后恢复选中、展开集合、视图、缩放和平移。</li></ol><p>业务、实现、覆盖是投影。覆盖视图分别显示材料处理、业务调查、证据与测试执行状态；未关联执行记录明确写“未关联执行”，不画一个绿色通过图标。</p><h3>检查器的信息顺序</h3><p>身份与类型 → 当前状态 → 适用范围 → 来源/事实集/图谱身份 → 支撑与反证 → 原文定位 → 限制与待办 → 活动记录。边的检查器额外展示起点、终点、方向、关系类型与该边独有的证据。</p><p>同一来源可以支撑不同命题，但每条命题要说明支撑到哪一步。人工确认记录保留人、时间、对象、范围、版本和说明；新来源到来时旧决定保留为历史记录，不能自动给新图谱贴上同样确认标签。</p><h3>调查结果的五路呈现</h3><div class=&quot;table-scroll&quot;><table><tr><th>业务处置</th><th>页面呈现</th><th>可执行下一步</th></tr><tr><td>证据充分</td><td>Agent 分析态进入图谱，附依据与范围</td><td>浏览、继续调查或按需复核</td></tr><tr><td>证据不足</td><td>保留调查状态与缺少的证据</td><td>补充调查</td></tr><tr><td>规则有歧义</td><td>具体命题进入需确认队列，给出选项和原文</td><td>人工确认当前命题 / 继续调查</td></tr><tr><td>暂无业务解释</td><td>材料在覆盖视图保持待解释</td><td>从材料继续调查</td></tr><tr><td>引用、权限或版本不合法</td><td>隔离并展示修复原因</td><td>修复引用/权限/版本，不让业务用户猜着批准</td></tr></table></div><h2 id=&quot;section-10&quot;>10 · 状态、反馈与恢复</h2><div class=&quot;table-scroll&quot;><table><tr><th>状态</th><th>用户应该看到</th><th>恢复与保留</th></tr><tr><td>初始加载</td><td>对应真实布局的骨架与加载说明</td><td>不闪现空态</td></tr><tr><td>局部刷新</td><td>旧内容仍可读，受影响区域有刷新提示</td><td>筛选和选择保留</td></tr><tr><td>任务运行</td><td>当前阶段、已知进度、处理对象、最近活动</td><td>可离开页面；返回能恢复</td></tr><tr><td>等待外部条件</td><td>等什么、影响哪一步、检查或重试入口</td><td>不伪装持续进度</td></tr><tr><td>采集失败</td><td>失败来源、保留数量、旧可用版本、恢复动作</td><td>不覆盖已冻结来源</td></tr><tr><td>权限不足</td><td>被限制的范围与授权/联系入口</td><td>不泄露原文或凭据</td></tr><tr><td>引用失效</td><td>原版本身份、失败原因、回查或修复</td><td>不用当前版本替换历史证据</td></tr><tr><td>编辑冲突</td><td>本地内容和最新版本差异</td><td>保留本地输入；显式选择</td></tr><tr><td>无结果</td><td>当前条件与清空操作</td><td>不说“还没有数据”</td></tr><tr><td>完成</td><td>完成对象、范围与下一步</td><td>清晰区分保存、应用、执行成功</td></tr></table></div><p>错误状态应由 domain state 驱动，禁止多个组件各自解释同一个错误码。可重试性必须由实际条件决定；不可恢复错误不提供无效“重试”。用户可追溯的决定、任务和消息默认持久保存，不能把本地样稿的 localStorage 当作产品持久化方案。</p><h2 id=&quot;section-11&quot;>11 · 动效与无障碍</h2><p>微反馈建议 120–160ms；面板和导航转换 180–240ms。动效解释空间变化，不承担等待时长承诺。禁止持续闪光、循环发光节点和为了“高级感”让所有元素漂浮。</p><p>prefers-reduced-motion 下取消平移、弹性和闪动，保留静态状态提示；增加对比度时加强边界并关闭不必要透明。深色不能只机械反相：分别检验文字、控件边界、状态底色、代码与图谱边。</p><p>目标是 WCAG 2.2 AA。普通文字至少 4.5:1，大文字至少 3:1，依据 <a href=&quot;https://www.w3.org/WAI/WCAG22/Understanding/contrast-minimum.html&quot; target=&quot;_blank&quot; rel=&quot;noreferrer&quot;>W3C Contrast Minimum ↗</a>。控件识别与必要图形按非文本对比要求评估，装饰线不能替代必要轮廓。</p><p>WCAG 2.2 最小目标尺寸的基准为 24 CSS px，并有间距等例外；见 <a href=&quot;https://www.w3.org/WAI/WCAG22/Understanding/target-size-minimum.html&quot; target=&quot;_blank&quot; rel=&quot;noreferrer&quot;>W3C Target Size Minimum ↗</a>。本提案对触控使用更宽松的 44px 设计目标，两者不混为一谈。</p><p>验收至少包括：全键盘主流程、可见焦点、没有意外焦点陷阱、对话框命名和返回焦点、中文输入法、读屏状态反馈、200% 字号、400% 缩放时重排、图谱的等价列表阅读。二维图形本身可保留平移，但周边控件与文字仍须可读。</p><h2 id=&quot;section-12&quot;>12 · 前端组件分层与状态契约</h2><p>建议使用现有 React 前端承接设计，先核验现有组件与依赖，不为了设计稿引入新的 UI 框架。此次样稿是独立 HTML/CSS/JS，不是生产实现或新的技术栈决定。</p><div class=&quot;table-scroll&quot;><table><tr><th>层级</th><th>责任</th><th>示例</th></tr><tr><td>Foundation</td><td>语义 token、排版、间距、动效、层级</td><td>color、space、type、radius、motion</td></tr><tr><td>Primitive</td><td>原生语义与交互基础</td><td>Button、TextField、Select、Dialog</td></tr><tr><td>Composite</td><td>通用任务结构</td><td>PageHeader、DataTable、Inspector、EmptyState</td></tr><tr><td>Domain</td><td>业务意义与跨版本身份</td><td>EvidenceReference、SourceTask、ClaimStatus、GraphEdgeDetail</td></tr><tr><td>Page</td><td>数据与流程编排</td><td>来源、证据、图谱、影响、设置</td></tr></table></div><p>代表性组件契约提案：</p><ul><li>Button：variant、size、loading、disabled、accessibleLabel、onPress。业务权限不在按钮内求值。</li><li>Field：id、label、description、error、required、readOnly。错误文本与控件关联由组件保证。</li><li>DataTable：稳定 rowId、columns、sort、filters、selectionScope、loadingState、error、pagination；由页面提供查询数据。</li><li>Inspector：selectedEntity、context、activeTab、onClose、openFullDetail。不能从“最近一次响应”隐式推断当前对象。</li><li>EvidenceReference：workspaceId、sourceIdentity、materialIdentity、locator、accessState；事实引用额外携带 factSetIdentity + factId，图谱引用携带 graphVersionIdentity + node/edgeId。</li><li>ClaimStatus：analysisState、confirmationState、evidenceState、scope。不能压成一个 success 布尔值。</li><li>GraphView：nodes、directedEdges、projection、filters、selection、expandedSet、viewport、onInspectNode、onInspectEdge。画布和列表消费同一模型。</li><li>RunProgress：runId、stage、processed、totalKnown、blockedReason、recoverability、lastActivity。只有 totalKnown 成立才计算百分比。</li><li>SettingsEditor：draft、savedDraft、appliedVersion、validation、runtimeSnapshotRefs。切换保存/应用必须走明确动作。</li></ul><p>这些是前端责任边界，不定义新的后端 endpoint，也不覆盖已有 schema。实现时适配当前权威数据契约，发现冲突先修正提案映射。</p><p>样式统一从 token 输出 CSS 变量；禁止在页面散落任意十六进制色值。组件展台应覆盖基础状态和真实长内容；domain 组件绑定构造 fixture，禁止读取生产数据做开发演示。</p><h2 id=&quot;section-13&quot;>13 · 质量门与验收矩阵</h2><p>审美验收不是只看首页：必须覆盖核心工作面、操作后的状态和失败恢复。以下是正式实现的验收要求，并非声称样稿已经完成全部标准认证。</p><div class=&quot;table-scroll&quot;><table><tr><th>验收主题</th><th>可观察条件</th></tr><tr><td>视觉一致</td><td>六个主页面使用同一排版、按钮、输入、状态和间距；没有孤立风格</td></tr><tr><td>来源恢复</td><td>新任务失败后旧来源可读；当前阶段、数量、原因和恢复动作在同一任务附近</td></tr><tr><td>证据回查</td><td>从业务对象和关系均能到固定原文；身份与定位不缺失</td></tr><tr><td>图谱语义</td><td>类型与状态独立；关系方向明确；分析态和人工确认不同；列表能完成等价阅读</td></tr><tr><td>人工决定</td><td>只更新所选命题；其余对象保持状态；说明可恢复；历史决定可回查</td></tr><tr><td>配置范围</td><td>全局/工作区/Agent 权限可区分；草稿与应用分离；旧运行不热切换</td></tr><tr><td>表单</td><td>无效输入被定位并保留；长中文/URL 不破坏布局；提交防重</td></tr><tr><td>无障碍</td><td>键盘、焦点、读屏、对比度、缩放、减少动态按第 11 节核验</td></tr><tr><td>响应式</td><td>390、768、1280、1600、1920 宽度下主操作可达；320px 基础阅读可用</td></tr><tr><td>状态完整</td><td>首次空态、筛选无结果、加载、部分失败、受限、失效、冲突均有明确设计</td></tr><tr><td>性能</td><td>有测量记录，卡顿发生在哪个数据规模可追查；不以截图代替性能证明</td></tr></table></div><p>性能预算作为待验证的工程目标：常规交互反馈目标小于 100ms；长任务及时显示启动反馈；图谱先验证 100 节点 / 200 关系的局部场景，大规模进入聚合与按需展开。此处不是产品已达到的 benchmark。达不到时调整呈现与数据策略，不通过静默丢弃节点改善数字。</p><h3>必须走通的体验路径</h3><ol><li>创建来源草稿：输入独有名称 → 无效地址提示 → 修正 → 保存 → 列表出现 → 刷新仍存在。</li><li>恢复采集：看到中断对象与进度 → 重新连接 → 核对身份 → 继续；旧冻结版本持续可读。</li><li>追溯业务：搜索取消订单 → 查看节点 → 查看实现关系 → 打开固定依据 → 返回原探索位置。</li><li>处理歧义：阅读原文 → 写适用条件 → 决定当前命题或继续调查 → 查看记录；不能批准无关节点。</li><li>变更分析：固定两端版本 → 读已知与未知 → 查看路径 → 得到尚未执行的验证建议。</li><li>配置能力：切换作用范围 → 改草稿 → 保存 → 应用 → 明确新运行使用新配置。</li><li>窄屏：打开导航 → 进入图谱列表 → 选中对象 → 阅读详情 → 关闭返回列表。</li></ol><h2 id=&quot;section-14&quot;>14 · 交付物、覆盖与明确限制</h2><p>本提案目录包含：</p><ul><li>体验样稿：工作区概览、来源快照、技术证据、业务图谱、变更影响、设置中心。</li><li>组件展台：色彩、文字、按钮、输入、选择、状态、列表和恢复。</li><li>效果图：由真实样稿渲染，包含浅色、深色、移动端和操作状态。</li><li>当前总纲：本 Markdown 及浏览器阅读版。</li><li>Pencil 设计板：用于继续编辑核心视觉布局；完整交互以浏览器样稿为准。</li></ul><div class=&quot;table-scroll&quot;><table><tr><th>范围</th><th>本次交付</th><th>正式实现仍需</th></tr><tr><td>页面与视觉</td><td>七个可浏览页面、两种外观、窄屏适配</td><td>现有产品页面迁移与完整跨浏览器验收</td></tr><tr><td>示例交互</td><td>来源草稿、搜索、选中、关系、筛选、缩放、确认说明、配置草稿/应用</td><td>接入真实身份、权限、持久化与异步任务</td></tr><tr><td>图谱</td><td>局部固定示例、检查器、列表和一步展开</td><td>完整图布局、大规模聚合、完整列表关系详情与历史版本</td></tr><tr><td>技术证据</td><td>OrderService 的代码与事实示例</td><td>各类对象全量提取结果、真实原文定位</td></tr><tr><td>设置</td><td>作用范围和代表性能力切换</td><td>完整账号/模型/Skill/MCP 编辑及验证</td></tr><tr><td>无障碍</td><td>原生语义、标签、焦点样式、键盘示例与减少动态</td><td>读屏实测、全部控件模式、缩放和浏览器组合认证</td></tr></table></div><p>样稿内有明确示例标识。不会连接填写的仓库，不会采集本地目录，不会调用模型，不会执行测试或修改真实业务数据。演示说明保存在专用本机命名空间；正式产品需要后端持久保存与权限校验。</p><h2 id=&quot;section-15&quot;>15 · 采用后的落实顺序</h2><p>完整方案确认后，再把正式 F005 定位改为“整体体验与前端设计总纲”，将本提案的已批准内容整合进权威文档。各 Feature 引用 F005 的视觉与交互规范，不复制多套 token。</p><ol><li>建立语义 token、排版、AppShell 和基础组件展台。</li><li>迁移来源快照和技术证据，先完成输入、长列表、原文和恢复状态。</li><li>落地图谱、检查器、关系依据与待确认队列，按 F003 V2 处理状态。</li><li>统一变更影响与设置范围，补齐只读、失效、冲突和权限场景。</li><li>对照效果图与体验路径验收，记录偏差；达到标准后再替换旧样式。</li></ol><p>本次尚未修改正式 F005、架构、ADR 或生命周期索引。要进入正式采用，需确认整体方案并授权相应文档写回；确认个别颜色或尺寸不等于批准整体方案。</p><h2 id=&quot;section-16&quot;>16 · 依据与设计记录</h2><p>产品依据（阅读日期 2026-09-15；新确认内容优先于旧概览）：</p><ul><li>F001：feature-discussions/2026-08-30-F001-workspace-source-truth-design/README.zh-CN.md。</li><li>F002：feature-discussions/2026-09-09-F002-deterministic-facts-design/README.zh-CN.md，已评审 V4 功能全景。</li><li>F003：feature-discussions/2026-09-09-F003-traceability-graph-design/README.zh-CN.md，已接受 V2 功能全景。</li><li>F006：docs/features/F006-workspace-capability-settings.zh-CN.md。</li><li>产品目标：docs/architecture/traqen-system-requirements.zh-CN.md；涉及 F003 自动入库与确认的旧描述由上列新确认文档优先解释。</li><li>提案触发：用户要求重新设计并将 F005 作为前端视觉与体验总纲，消息 0001789458139802-000323-ea91580b。</li></ul><p>外部依据限于本提案相应段落的官方资料：Apple 的内容/控制层次与材质思路；W3C 的对比度、目标尺寸和 Combobox 交互要求。具体 Traqen 色值、尺寸、组件分层、页面布局及性能预算均为本提案的设计判断。</p><p>此次改进记录：上一版把结构齐全当成视觉与体验完成，缺少代表性交互状态、中文密度和完整规范的共同验证。V2 使用同一实现生成效果图，并将“依据—判断—动作—恢复”作为每个页面的检查顺序。后续变更必须带受影响组件状态的实际渲染，不能只凭首页截图验收。</p></main></html>"></iframe></dialog><script>document.addEventListener('click',e=>{const a=e.target.closest('a[href="charter.html"]');if(a){e.preventDefault();document.getElementById('charter-dialog').showModal()}});document.getElementById('close-charter').onclick=()=>document.getElementById('charter-dialog').close();</script></body>
