<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>F001 来源快照工作台 v2</title>
  <style>
    :root {
      --bg: #f5f7fb;
      --surface: #ffffff;
      --surface-soft: #f8fafc;
      --sidebar: #f2f4f8;
      --text: #111827;
      --muted: #64748b;
      --border: #dbe3ef;
      --border-strong: #cbd5e1;
      --blue: #2563eb;
      --blue-soft: #e8f1ff;
      --green: #16a34a;
      --green-soft: #eaf8ef;
      --orange: #d97706;
      --orange-soft: #fff7e6;
      --red: #dc2626;
      --red-soft: #fff0f0;
      --shadow: 0 1px 2px rgba(15, 23, 42, .05), 0 8px 24px rgba(15, 23, 42, .04);
      font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    }

    * { box-sizing: border-box; }
    html, body { margin: 0; width: 100%; min-width: 1180px; height: 100%; color: var(--text); background: var(--bg); }
    body { display: flex; overflow: hidden; }
    button { font: inherit; }

    .sidebar {
      width: 236px;
      height: 100vh;
      flex: 0 0 236px;
      background: var(--sidebar);
      border-right: 1px solid var(--border);
      padding: 22px 16px 18px;
      display: flex;
      flex-direction: column;
    }

    .brand { display: flex; align-items: center; gap: 11px; margin-bottom: 24px; font-size: 20px; font-weight: 800; }
    .brand-mark { width: 34px; height: 34px; border-radius: 10px; display: grid; place-items: center; color: #fff; background: var(--blue); box-shadow: 0 7px 14px rgba(37, 99, 235, .2); }
    .side-label { margin: 0 8px 9px; font-size: 11px; font-weight: 800; letter-spacing: .14em; color: #718096; text-transform: uppercase; }
    .workspace-card { padding: 13px 14px; border: 1px solid #8fb9ff; border-radius: 12px; background: #e5efff; margin-bottom: 24px; }
    .workspace-card strong { display: block; font-size: 14px; }
    .workspace-card span { display: block; margin-top: 4px; color: var(--muted); font-size: 11px; }

    .side-nav { display: grid; gap: 6px; }
    .side-nav-item { min-height: 42px; padding: 0 12px; border-radius: 9px; display: flex; align-items: center; gap: 10px; color: #526078; font-size: 13px; }
    .side-nav-item.active { color: #1557c9; background: #dce9fb; box-shadow: inset 3px 0 0 var(--blue); font-weight: 700; }
    .side-nav-item .icon { width: 18px; text-align: center; font-size: 14px; }
    .side-separator { height: 1px; background: var(--border); margin: 18px 8px; }
    .sidebar-spacer { flex: 1; }
    .truth-note { padding: 13px; border: 1px solid var(--border); border-radius: 11px; background: rgba(255,255,255,.75); color: var(--muted); font-size: 11px; line-height: 1.55; }
    .truth-note strong { display: block; color: var(--blue); margin-bottom: 4px; }

    .app { min-width: 0; flex: 1; height: 100vh; display: flex; flex-direction: column; }
    .topbar { height: 58px; flex: 0 0 58px; padding: 0 26px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid var(--border); background: rgba(255,255,255,.82); }
    .breadcrumb { display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: 12px; }
    .breadcrumb strong { color: var(--text); }
    .top-actions { display: flex; align-items: center; gap: 9px; }
    .top-pill { padding: 7px 10px; border: 1px solid var(--border); border-radius: 999px; background: var(--surface); color: #526078; font-size: 11px; font-weight: 700; }
    .top-pill.live::before { content: ""; display: inline-block; width: 7px; height: 7px; border-radius: 50%; margin-right: 6px; background: var(--green); }

    .content { flex: 1; min-height: 0; padding: 18px 26px 16px; display: flex; flex-direction: column; gap: 12px; }
    .page-heading { min-height: 66px; display: flex; justify-content: space-between; align-items: flex-start; gap: 18px; }
    .eyebrow { margin: 0 0 5px; color: var(--blue); font-size: 11px; font-weight: 800; letter-spacing: .12em; text-transform: uppercase; }
    h1 { margin: 0; font-size: 30px; line-height: 1.12; letter-spacing: -.03em; }
    .subtitle { margin: 7px 0 0; color: var(--muted); font-size: 13px; }
    .heading-status { margin-top: 3px; display: inline-flex; align-items: center; gap: 7px; padding: 8px 11px; border-radius: 9px; color: #174ea6; background: var(--blue-soft); font-size: 12px; font-weight: 800; white-space: nowrap; }
    .heading-status.warning { color: #9a5800; background: var(--orange-soft); }
    .heading-status.danger { color: #b42318; background: var(--red-soft); }
    .heading-status.success { color: #137333; background: var(--green-soft); }

    .panel { border: 1px solid var(--border); border-radius: 14px; background: var(--surface); box-shadow: var(--shadow); }
    .metro-panel { height: 176px; flex: 0 0 176px; padding: 16px 20px 13px; }
    .metro-head { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 13px; }
    .metro-title { font-size: 14px; font-weight: 800; }
    .metro-caption { margin-top: 4px; color: var(--muted); font-size: 11px; }
    .position-pill { padding: 7px 10px; border-radius: 999px; background: var(--blue-soft); color: var(--blue); font-size: 11px; font-weight: 800; }
    .position-pill.warning { color: #9a5800; background: var(--orange-soft); }
    .position-pill.danger { color: #b42318; background: var(--red-soft); }
    .position-pill.success { color: #137333; background: var(--green-soft); }

    .rail { position: relative; display: grid; grid-template-columns: repeat(8, 1fr); align-items: start; gap: 0; padding: 0 15px; }
    .rail::before { content: ""; position: absolute; left: 7.3%; right: 7.3%; top: 17px; height: 4px; border-radius: 999px; background: #d8dde6; }
    .rail-progress { position: absolute; left: 7.3%; top: 17px; height: 4px; border-radius: 999px; background: var(--green); }
    .station { position: relative; z-index: 1; text-align: center; }
    .node { width: 36px; height: 36px; margin: 0 auto 8px; display: grid; place-items: center; border: 3px solid #c8ced8; border-radius: 50%; background: var(--surface); color: #7b8492; font-size: 12px; font-weight: 900; }
    .station.done .node { border-color: var(--green); color: #fff; background: var(--green); }
    .station.current .node { border-color: #cfe0ff; color: #fff; background: var(--blue); box-shadow: 0 0 0 5px #eaf2ff; }
    .station.current.warning .node { border-color: #fde4b2; background: var(--orange); box-shadow: 0 0 0 5px #fff6e5; }
    .station.current.danger .node { border-color: #fecaca; background: var(--red); box-shadow: 0 0 0 5px #fff0f0; }
    .station.current.success .node { border-color: #bbf7d0; background: var(--green); box-shadow: 0 0 0 5px #ebfaef; }
    .station-name { font-size: 11px; font-weight: 800; white-space: nowrap; }
    .station.current .station-name { color: var(--blue); }
    .station.current.warning .station-name { color: var(--orange); }
    .station.current.danger .station-name { color: var(--red); }
    .station.current.success .station-name { color: var(--green); }
    .station-hint { margin-top: 4px; color: #8b94a3; font-size: 9px; white-space: nowrap; }
    .legend { display: flex; align-items: center; gap: 16px; margin-top: 13px; border-top: 1px solid #eef2f7; padding-top: 10px; color: var(--muted); font-size: 10px; }
    .legend span::before { content: ""; display: inline-block; width: 8px; height: 8px; margin-right: 5px; border-radius: 50%; background: #c8ced8; }
    .legend .l-done::before { background: var(--green); }
    .legend .l-current::before { background: var(--blue); }
    .legend .l-warning::before { background: var(--orange); }
    .legend .l-danger::before { background: var(--red); }

    .workbench { min-height: 0; flex: 1; display: grid; grid-template-columns: minmax(0, 1.72fr) minmax(280px, .78fr); gap: 12px; }
    .current-card { min-height: 0; padding: 17px 18px; display: flex; flex-direction: column; overflow: hidden; }
    .current-card.state-warning { border-color: #f0bb63; }
    .current-card.state-danger { border-color: #f39a9a; }
    .card-head { display: flex; justify-content: space-between; gap: 15px; align-items: flex-start; margin-bottom: 12px; }
    .step-label { margin: 0 0 4px; color: var(--muted); font-size: 10px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; }
    .card-head h2 { margin: 0; font-size: 20px; letter-spacing: -.02em; }
    .card-copy { margin: 5px 0 0; color: var(--muted); font-size: 12px; line-height: 1.55; }
    .badge { display: inline-flex; align-items: center; padding: 6px 9px; border-radius: 999px; font-size: 10px; font-weight: 900; white-space: nowrap; }
    .badge.blue { color: #1557c9; background: var(--blue-soft); }
    .badge.green { color: #137333; background: var(--green-soft); }
    .badge.orange { color: #9a5800; background: var(--orange-soft); }
    .badge.red { color: #b42318; background: var(--red-soft); }
    .badge.gray { color: #5f6b7a; background: #eef2f7; }

    .source-grid { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 11px; }
    .source-card { padding: 13px 14px; border: 1px solid var(--border); border-radius: 11px; background: var(--surface-soft); }
    .source-card.selected { border-color: #9ec0fb; background: #f2f7ff; }
    .source-title { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-bottom: 8px; font-size: 13px; font-weight: 800; }
    .source-title span:first-child { display: flex; align-items: center; gap: 7px; }
    .source-meta { display: grid; grid-template-columns: auto 1fr; gap: 6px 10px; color: var(--muted); font-size: 10px; }
    .source-meta strong { color: #253046; text-align: right; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .source-description { min-height: 34px; color: var(--muted); font-size: 11px; line-height: 1.55; }
    .source-actions { display: flex; gap: 8px; margin-top: 10px; }

    .progress-block { padding: 11px 12px; border: 1px solid var(--border); border-radius: 10px; background: var(--surface-soft); margin-bottom: 9px; }
    .progress-head { display: flex; justify-content: space-between; gap: 10px; align-items: center; font-size: 11px; }
    .progress-head strong { font-size: 12px; }
    .progress-meta { color: var(--muted); font-size: 10px; }
    .progress-track { height: 7px; overflow: hidden; margin: 9px 0 7px; border-radius: 99px; background: #e7ecf3; }
    .progress-value { height: 100%; border-radius: inherit; background: var(--blue); }
    .progress-value.green { background: var(--green); }
    .progress-foot { display: flex; justify-content: space-between; color: var(--muted); font-size: 10px; }

    .inventory-grid { display: grid; grid-template-columns: repeat(4, minmax(0,1fr)); gap: 8px; margin-bottom: 10px; }
    .metric { padding: 10px 11px; border: 1px solid var(--border); border-radius: 9px; background: var(--surface-soft); }
    .metric span { display: block; color: var(--muted); font-size: 9px; }
    .metric strong { display: block; margin-top: 3px; font-size: 17px; }
    .gap-list { display: grid; gap: 7px; }
    .gap-row { padding: 9px 10px; display: grid; grid-template-columns: 18px minmax(0,1fr) auto; align-items: center; gap: 9px; border: 1px solid #f3d3a0; border-radius: 9px; background: #fffaf0; font-size: 10px; }
    .gap-row.danger { border-color: #f4b3b3; background: #fff4f4; }
    .gap-icon { width: 18px; height: 18px; display: grid; place-items: center; border-radius: 50%; color: #fff; background: var(--orange); font-weight: 900; }
    .gap-row.danger .gap-icon { background: var(--red); }
    .gap-row strong { display: block; font-size: 11px; }
    .gap-row p { margin: 2px 0 0; color: var(--muted); }

    .receipt { display: grid; grid-template-columns: 1.2fr 1fr; gap: 10px; }
    .receipt-main, .receipt-side { padding: 12px 13px; border: 1px solid var(--border); border-radius: 10px; background: var(--surface-soft); }
    .receipt-main h3, .receipt-side h3 { margin: 0 0 9px; font-size: 12px; }
    .receipt-id { margin-bottom: 9px; color: var(--blue); font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; font-weight: 800; }
    .receipt-line { display: flex; justify-content: space-between; gap: 14px; padding: 6px 0; border-top: 1px solid #e6ebf2; color: var(--muted); font-size: 10px; }
    .receipt-line strong { color: #253046; text-align: right; }
    .admission { padding: 10px; border-radius: 9px; background: var(--blue-soft); color: #174ea6; font-size: 10px; line-height: 1.5; }

    .danger-box { padding: 13px; border: 1px solid #f29a9a; border-left: 4px solid var(--red); border-radius: 10px; background: var(--red-soft); }
    .danger-box h3 { margin: 0 0 7px; font-size: 13px; color: #9f1d1d; }
    .danger-box p { margin: 4px 0; color: #8f2a2a; font-size: 11px; line-height: 1.55; }
    .code { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }

    .action-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-top: auto; padding-top: 11px; }
    .action-set { display: flex; gap: 8px; }
    .button { min-height: 34px; padding: 0 12px; border: 1px solid var(--border-strong); border-radius: 8px; background: var(--surface); color: #263247; font-size: 11px; font-weight: 800; }
    .button.primary { border-color: var(--blue); color: #fff; background: var(--blue); }
    .button.warn { border-color: #e0a64b; color: #8a4e00; background: #fff9ec; }
    .button.danger { border-color: #f1aaaa; color: #b42318; background: #fff6f6; }
    .button:disabled { border-color: #dde3ec; color: #a0a8b5; background: #f3f5f8; }

    .context-stack { min-height: 0; display: grid; grid-template-rows: 1fr 1.18fr; gap: 12px; }
    .context-card { min-height: 0; padding: 15px 16px; overflow: hidden; }
    .context-card h3 { margin: 0 0 9px; font-size: 13px; }
    .context-card p { margin: 0; color: var(--muted); font-size: 11px; line-height: 1.6; }
    .context-card .context-kicker { display: block; margin-bottom: 7px; color: var(--muted); font-size: 9px; font-weight: 800; letter-spacing: .09em; text-transform: uppercase; }
    .context-card.next { border-color: #acd0ff; background: #f3f8ff; }
    .context-card.next h3 { color: #1557c9; }
    .evidence-list { display: grid; gap: 7px; margin-top: 10px; }
    .evidence-item { padding: 8px 9px; border-radius: 8px; background: #f3f5f8; color: #445067; font-size: 10px; }
    .evidence-item::before { content: "✓"; margin-right: 6px; color: var(--green); font-weight: 900; }

    .footer-strip { min-height: 54px; flex: 0 0 54px; padding: 10px 13px; display: flex; align-items: center; justify-content: space-between; gap: 14px; }
    .footer-copy { min-width: 0; }
    .footer-copy strong { display: block; font-size: 11px; }
    .footer-copy span { display: block; margin-top: 3px; color: var(--muted); font-size: 10px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .footer-actions { display: flex; align-items: center; gap: 8px; flex: 0 0 auto; }

    @media (max-width: 1300px) {
      .sidebar { width: 216px; flex-basis: 216px; }
      .content { padding-left: 20px; padding-right: 20px; }
      .station-name { font-size: 10px; }
    }
  </style>
</head>
<body>
  <aside class="sidebar" aria-label="F001 工作区上下文">
    <div class="brand"><span class="brand-mark">T</span><span>Traqen</span></div>
    <p class="side-label">Workspace</p>
    <div class="workspace-card">
      <strong>order-platform</strong>
      <span>当前基线 · r3</span>
    </div>
    <p class="side-label">来源真相</p>
    <nav class="side-nav">
      <div class="side-nav-item active"><span class="icon">◎</span><span>来源快照</span></div>
      <div class="side-nav-item"><span class="icon">◷</span><span>快照历史</span></div>
    </nav>
    <div class="side-separator"></div>
    <div class="side-nav-item"><span class="icon">⌁</span><span>清单与缺口</span></div>
    <div class="sidebar-spacer"></div>
    <div class="truth-note">
      <strong>F001 边界</strong>
      只负责取得、核验并冻结来源包。业务、API 与影响判断不在本页面发生。
    </div>
  </aside>

  <div class="app">
    <header class="topbar">
      <div class="breadcrumb"><span>order-platform</span><span>/</span><strong>来源快照</strong></div>
      <div class="top-actions">
        <span class="top-pill live">连接正常</span>
        <span class="top-pill">Enterprise</span>
        <span class="top-pill">中文</span>
        <span class="top-pill">WEB-OPERATOR</span>
      </div>
    </header>

    <main class="content">
      <section class="page-heading">
        <div>
          <p class="eyebrow">F001 · Workspace & Source Truth</p>
          <h1 id="page-title"></h1>
          <p class="subtitle" id="page-subtitle"></p>
        </div>
        <div class="heading-status" id="heading-status"></div>
      </section>

      <section class="metro-panel panel" aria-label="F001 八站来源包旅程">
        <div class="metro-head">
          <div>
            <div class="metro-title">来源包旅程</div>
            <div class="metro-caption">完整流程固定在当前任务现场；完成站可回看证据，下一站只显示进入条件。</div>
          </div>
          <div class="position-pill" id="position-pill"></div>
        </div>
        <div class="rail" id="rail"></div>
        <div class="legend">
          <span class="l-done">已完成并留证</span>
          <span class="l-current">当前步骤</span>
          <span>尚未到达</span>
          <span class="l-warning">带已知限制</span>
          <span class="l-danger">不可绕过的阻断</span>
        </div>
      </section>

      <section class="workbench">
        <article class="current-card panel" id="current-card"></article>
        <aside class="context-stack">
          <section class="context-card panel" id="previous-card"></section>
          <section class="context-card panel next" id="next-card"></section>
        </aside>
      </section>

      <section class="footer-strip panel" id="footer-strip"></section>
    </main>
  </div>

  <script>
    const stations = [
      ["添加来源", "Git 和/或目录"],
      ["配置范围", "根目录与版本"],
      ["自动预检", "权限与安全"],
      ["枚举材料", "发现完整范围"],
      ["冻结清单", "锁定可信分母"],
      ["采集与校验", "双来源并行"],
      ["核对清单与缺口", "Inventory / Gap"],
      ["冻结来源包", "Bundle / Receipt"]
    ];

    const views = {
      empty: {
        current: 1,
        tone: "blue",
        title: "建立首个来源快照",
        subtitle: "选择 Git 仓库、本地目录，或同时选择两者；系统会把它们作为独立来源组件冻结到同一个来源包。",
        status: "尚未开始 · 第 1 / 8 站",
        stepTitle: "添加来源",
        stepCopy: "至少添加一种来源后才能继续。Git 与目录不是互斥选项，也不会因为路径同名而互相覆盖。",
        badge: "等待选择",
        badgeTone: "gray",
        content: `
          <div class="source-grid">
            <section class="source-card">
              <div class="source-title"><span>◇ Git 来源</span><span class="badge blue">推荐</span></div>
              <div class="source-description">填写只读仓库地址并选择版本。branch 或 tag 只用于定位，系统最终锁定精确 commit。</div>
              <div class="source-actions"><button class="button primary">添加 Git 来源</button></div>
            </section>
            <section class="source-card">
              <div class="source-title"><span>▣ 本地目录</span><span class="badge gray">全量 / 增量</span></div>
              <div class="source-description">首次完整枚举；后续重选目录时仍完整枚举以发现删除，但只上传服务端缺失的变化字节。</div>
              <div class="source-actions"><button class="button primary">选择目录</button></div>
            </section>
          </div>
          <div class="action-row">
            <span class="progress-meta">用户不需要配置 glob、哈希算法或并发参数。</span>
            <button class="button" disabled>继续配置范围</button>
          </div>`,
        previous: `<span class="context-kicker">上一步</span><h3>尚无历史步骤</h3><p>当前 Workspace 还没有来源快照。若以后创建新版本，这里会显示所选基线及其 Receipt。</p>`,
        next: `<span class="context-kicker">下一站 · 第 2 站</span><h3>配置范围</h3><p>添加来源后确认 Git 目录根和目录上传范围。系统会自动展示采用全量还是增量路径，不把采集策略交给用户。</p>`,
        footer: `<div class="footer-copy"><strong>尚无已冻结来源包</strong><span>下游能力保持关闭；选择来源不会自动启动采集。</span></div><div class="footer-actions"><button class="button" disabled>下游准入未解锁</button></div>`
      },

      capturing: {
        current: 6,
        tone: "blue",
        title: "建立第 4 版来源快照",
        subtitle: "清单已经冻结；Git 与目录沿各自路径采集和校验，完成后汇入同一来源包。",
        status: "运行中 · 第 6 / 8 站",
        stepTitle: "采集与校验",
        stepCopy: "分母来自已冻结清单。页面只显示服务端检查点与可证明计数，不估算剩余时间。",
        badge: "运行中",
        badgeTone: "blue",
