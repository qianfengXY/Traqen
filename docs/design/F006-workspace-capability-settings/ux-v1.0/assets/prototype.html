<!doctype html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>F006 · Workspace 能力设置 UX v1.0（隔离演示）</title>
  <style>
    :root {
      color-scheme: light;
      --page: #f5f5f7; --surface: #fff; --surface-2: #f0f1f4; --nav: #ebedf1;
      --text: #1d1d1f; --muted: #626570; --meta: #6b6f7b; --line: #e1e3e8; --control: #898f9b;
      --blue: #0066cc; --blue-soft: #e8f1ff; --on-blue: #fff; --success: #28714b; --success-soft: #e9f5ee;
      --warning: #945c05; --warning-soft: #fff4df; --danger: #b43232; --danger-soft: #fdeceb;
      --purple: #7054ad; --focus: rgba(0,102,204,.38); --shadow: 0 14px 34px rgba(28,31,38,.08);
      --sidebar: 224px; --gutter: 34px;
    }
    [data-theme="dark"] {
      color-scheme: dark;
      --page: #16171b; --surface: #222329; --surface-2: #292b33; --nav: #1c1d23;
      --text: #f2f3f6; --muted: #b3b7c3; --meta: #9a9eab; --line: #3c3e48; --control: #72788a;
      --blue: #84bbff; --blue-soft: #263b59; --on-blue: #142033; --success: #8dceac; --success-soft: #173527;
      --warning: #eac283; --warning-soft: #3c2d16; --danger: #ffaaa4; --danger-soft: #442124;
      --purple: #c2acef; --focus: rgba(132,187,255,.48); --shadow: 0 14px 34px rgba(0,0,0,.27);
    }
    * { box-sizing: border-box; }
    html, body { min-width: 960px; margin: 0; background: var(--page); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Segoe UI", "Noto Sans SC", sans-serif; font-size: 13px; line-height: 20px; }
    button, input, select { font: inherit; }
    button, select, input { -webkit-font-smoothing: antialiased; }
    button { cursor: pointer; }
    button:disabled { cursor: not-allowed; opacity: .54; }
    :focus-visible { outline: 3px solid var(--focus); outline-offset: 3px; }
    .shell { min-height: 100vh; display: grid; grid-template-columns: var(--sidebar) minmax(0, 1fr); }
    .side { background: var(--nav); border-right: 1px solid var(--line); padding: 18px 14px 12px; display: flex; flex-direction: column; gap: 12px; }
    .brand { display: flex; align-items: center; gap: 9px; padding: 0 8px; font-size: 17px; font-weight: 650; letter-spacing: -.2px; }
    .brand-mark { width: 28px; height: 28px; display: grid; place-items: center; border-radius: 9px; background: var(--blue); color: var(--on-blue); font-size: 12px; font-weight: 700; }
    .workspace-chip { padding: 10px 12px; border: 1px solid var(--line); background: var(--surface); border-radius: 12px; }
    .workspace-chip small, .nav-label, .eyebrow { color: var(--meta); font-size: 11px; line-height: 16px; letter-spacing: .08em; text-transform: uppercase; font-weight: 650; }
    .workspace-chip strong { display: block; margin-top: 2px; font-size: 13px; }
    .nav-group, .recent-list { display: grid; gap: 4px; }
    .nav-label { padding: 0 10px 2px; }
    .nav-item { min-height: 32px; width: 100%; padding: 0 10px; display: flex; gap: 9px; align-items: center; text-align: left; border: 0; border-radius: 9px; background: transparent; color: var(--muted); }
    .nav-icon { width: 17px; height: 17px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
    .nav-item.current { color: var(--blue); background: var(--blue-soft); font-weight: 600; }
    .side-rule { height: 1px; background: var(--line); margin: 2px 10px; }
    .side-foot { margin-top: auto; padding: 6px; border: 1px solid var(--line); border-radius: 12px; color: var(--muted); background: color-mix(in srgb, var(--surface) 72%, transparent); }
    .side-foot .nav-item { min-height: 28px; padding: 0 4px; }
    .account { display: grid; grid-template-columns: 25px minmax(0,1fr); gap: 8px; align-items: center; margin-top: 4px; padding-top: 5px; border-top: 1px solid var(--line); }
    .account-avatar { width: 25px; height: 25px; display: grid; place-items: center; border-radius: 50%; background: var(--blue-soft); color: var(--blue); font-size: 10px; font-weight: 700; }
    .account strong { display: block; color: var(--text); font-size: 12px; line-height: 16px; } .account span { color: var(--muted); font-size: 11px; font-weight: 500; }
    main { min-width: 0; padding: 24px var(--gutter) 32px; }
    .topline { min-height: 34px; display: flex; align-items: center; justify-content: space-between; gap: 20px; color: var(--muted); }
    .crumb { display: flex; gap: 8px; align-items: center; white-space: nowrap; }
    .crumb b { color: var(--text); font-weight: 600; }
    .status-pills { display: flex; align-items: center; gap: 8px; min-width: 0; }
    .quiet-status, .badge { display: inline-flex; align-items: center; gap: 6px; min-height: 24px; padding: 2px 8px; border-radius: 6px; font-size: 12px; white-space: nowrap; }
    .quiet-status { color: var(--muted); border: 1px solid var(--line); background: var(--surface); }
    .badge::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
    .badge.success { color: var(--success); background: var(--success-soft); } .badge.warning { color: var(--warning); background: var(--warning-soft); } .badge.danger { color: var(--danger); background: var(--danger-soft); } .badge.blue { color: var(--blue); background: var(--blue-soft); } .badge.purple { color: var(--purple); background: color-mix(in srgb, var(--purple) 14%, transparent); }
    .page-head { margin-top: 32px; display: flex; align-items: flex-start; justify-content: space-between; gap: 24px; }
    h1, h2, h3, p { margin: 0; } h1 { font-size: 32px; line-height: 40px; letter-spacing: -.5px; font-weight: 650; } h2 { font-size: 20px; line-height: 28px; letter-spacing: -.15px; } h3 { font-size: 15px; line-height: 22px; font-weight: 650; }
    .page-head > div > p:not(.eyebrow) { max-width: 720px; margin-top: 6px; color: var(--muted); font-size: 15px; line-height: 27px; }
    .head-actions { display: flex; align-items: center; gap: 10px; padding-top: 4px; flex-wrap: wrap; justify-content: flex-end; }
    .btn { min-height: 36px; border: 1px solid var(--control); border-radius: 9px; background: transparent; color: var(--text); padding: 0 13px; font-weight: 550; white-space: nowrap; }
    .btn:hover:not(:disabled) { background: var(--surface-2); } .btn.primary { border-color: var(--blue); background: var(--blue); color: var(--on-blue); } .btn.danger { color: var(--danger); border-color: color-mix(in srgb, var(--danger) 58%, var(--control)); } .btn.link { color: var(--blue); border-color: transparent; padding-left: 0; padding-right: 0; }
    .summary-row { margin-top: 24px; padding: 14px 16px; display: flex; justify-content: space-between; align-items: center; gap: 18px; border: 1px solid var(--line); border-radius: 16px; background: var(--surface); }
    .summary-row .summary-copy { display: flex; align-items: center; gap: 10px; min-width: 0; } .summary-row .summary-copy span { color: var(--muted); }
    .scope-select { min-height: 36px; border: 1px solid var(--control); border-radius: 9px; padding: 0 29px 0 11px; background: var(--surface); color: var(--text); }
    .settings-secondary { margin-top: 21px; display: flex; align-items: center; gap: 4px; padding: 4px; width: fit-content; border: 1px solid var(--line); border-radius: 11px; background: var(--surface); }
    .settings-secondary span { padding: 0 8px 0 5px; color: var(--meta); font-size: 11px; font-weight: 650; letter-spacing: .07em; text-transform: uppercase; }
    .settings-secondary button { min-height: 30px; padding: 0 10px; border: 0; border-radius: 7px; background: transparent; color: var(--muted); font-weight: 550; }
    .settings-secondary button.active { background: var(--blue-soft); color: var(--blue); }
    .content { margin-top: 24px; }
    .panel { border: 1px solid var(--line); border-radius: 16px; background: var(--surface); } .panel.pad { padding: 20px; } .panel + .panel { margin-top: 16px; }
    .section-head { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-bottom: 16px; } .section-head > p { color: var(--muted); }
    .notice { display: flex; gap: 10px; align-items: flex-start; padding: 12px 14px; border-radius: 9px; color: var(--warning); background: var(--warning-soft); } .notice strong { color: var(--text); } .notice.danger { color: var(--danger); background: var(--danger-soft); }
    .notice .dot { width: 8px; height: 8px; border-radius: 50%; flex: none; margin-top: 6px; background: currentColor; }
    .team-grid { display: grid; grid-template-columns: minmax(286px, .76fr) minmax(0, 1.24fr); gap: 20px; align-items: start; }
    .agent-list { padding: 8px; } .agent-section-title { padding: 8px 10px 5px; color: var(--meta); font-size: 11px; line-height: 16px; font-weight: 650; letter-spacing: .08em; text-transform: uppercase; }
    .agent-card { width: 100%; min-height: 72px; padding: 11px; display: grid; grid-template-columns: 28px minmax(0,1fr) auto; gap: 10px; align-items: center; text-align: left; border: 1px solid transparent; border-radius: 12px; background: transparent; color: var(--text); } .agent-card:hover { background: var(--surface-2); } .agent-card.selected { border-color: color-mix(in srgb, var(--blue) 42%, var(--line)); background: var(--blue-soft); }
    .agent-icon { width: 28px; height: 28px; border: 1px solid var(--control); border-radius: 9px; display: grid; place-items: center; color: var(--purple); font-size: 12px; font-weight: 700; } .agent-card.selected .agent-icon { color: var(--blue); border-color: var(--blue); }
    .agent-card small, .subtle { color: var(--muted); display: block; font-size: 12px; } .agent-card .badge { align-self: start; }
    .detail { min-height: 468px; padding: 20px; } .detail-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; padding-bottom: 16px; border-bottom: 1px solid var(--line); } .detail-head p { color: var(--muted); margin-top: 3px; }
    .fields { display: grid; grid-template-columns: repeat(2,minmax(0,1fr)); gap: 16px; margin-top: 20px; } label { display: grid; gap: 6px; color: var(--text); font-weight: 550; } label > span, .field-help { color: var(--muted); font-size: 12px; line-height: 18px; font-weight: 400; } input, select { width: 100%; min-height: 36px; border: 1px solid var(--control); border-radius: 9px; padding: 0 10px; background: var(--surface); color: var(--text); } input[aria-invalid="true"] { border-color: var(--danger); box-shadow: 0 0 0 2px color-mix(in srgb, var(--danger) 22%, transparent); }
    .grant-block { margin-top: 20px; } .grant-block > p { color: var(--muted); font-size: 12px; margin-top: 3px; } .grant-list { display: grid; gap: 8px; margin-top: 11px; } .check-row { display: flex; align-items: flex-start; gap: 9px; min-height: 40px; padding: 9px 10px; border: 1px solid var(--line); border-radius: 9px; } .check-row input { width: 16px; min-height: 16px; margin: 1px 0 0; accent-color: var(--blue); } .check-row span { display: block; color: var(--muted); font-size: 12px; } .check-row b { color: var(--text); font-size: 13px; }
    .wide-only { display: none; }
    .split { display: grid; grid-template-columns: 212px minmax(0, 1fr); gap: 20px; } .local-nav { padding: 8px; height: fit-content; } .local-nav button { display: block; width: 100%; min-height: 36px; padding: 0 10px; border: 0; border-radius: 9px; background: transparent; color: var(--muted); text-align: left; } .local-nav button.active { background: var(--blue-soft); color: var(--blue); font-weight: 600; }
    .table { width: 100%; border-collapse: collapse; } .table th { padding: 0 10px 9px; color: var(--meta); text-align: left; font-size: 11px; letter-spacing: .07em; text-transform: uppercase; } .table td { min-height: 52px; padding: 10px; border-top: 1px solid var(--line); vertical-align: middle; } .table td small { display: block; color: var(--muted); margin-top: 2px; } .row-actions { display: flex; gap: 8px; justify-content: flex-end; }
    .quad { display: grid; grid-template-columns: repeat(2,minmax(0,1fr)); gap: 16px; } .group-card { padding: 16px; } .group-card h3 { display: flex; justify-content: space-between; gap: 8px; } .group-card h3 span { color: var(--meta); font-size: 12px; font-weight: 500; } .cap-row { margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--line); } .cap-row:first-of-type { border-top: 0; } .cap-row p { color: var(--muted); font-size: 12px; margin-top: 3px; } .cap-row .inline { margin-top: 8px; }
    .form-grid { display: grid; grid-template-columns: minmax(0,1fr) minmax(0,1fr); gap: 18px; } .form-grid .panel { min-height: 280px; } .form-stack { display: grid; gap: 13px; } .error-text { color: var(--danger); font-size: 12px; line-height: 18px; }
    .timeline { display: grid; gap: 0; margin-top: 12px; } .event { display: grid; grid-template-columns: 20px minmax(0,1fr); gap: 9px; padding: 11px 0; border-top: 1px solid var(--line); } .event i { width: 10px; height: 10px; border-radius: 50%; background: var(--blue); margin: 5px; } .event p { color: var(--muted); font-size: 12px; } .event b { font-size: 13px; }
    .versions { display: grid; grid-template-columns: minmax(0,1.25fr) minmax(290px,.75fr); gap: 20px; } .version-number { font-size: 28px; line-height: 38px; font-weight: 650; letter-spacing: -.3px; } .key-value { display: flex; justify-content: space-between; gap: 14px; padding: 11px 0; border-top: 1px solid var(--line); } .key-value span { color: var(--muted); } .key-value b { text-align: right; }
    .f003-grid { display: grid; grid-template-columns: minmax(0,1fr) minmax(290px,.82fr); gap: 20px; } .checklist { display: grid; gap: 8px; margin-top: 14px; } .checklist div { display: flex; gap: 9px; align-items: flex-start; padding: 10px; border: 1px solid var(--line); border-radius: 9px; } .checklist i { width: 16px; height: 16px; border-radius: 50%; background: var(--success); color: var(--on-blue); font-style: normal; font-size: 11px; line-height: 16px; text-align: center; flex: none; }
    dialog { width: min(520px, calc(100vw - 48px)); padding: 0; border: 1px solid var(--line); border-radius: 16px; background: var(--surface); color: var(--text); box-shadow: var(--shadow); } dialog::backdrop { background: rgba(18,20,26,.48); } .dialog-inner { padding: 24px; } .dialog-inner p { margin-top: 7px; color: var(--muted); font-size: 15px; line-height: 24px; } .dialog-actions { display: flex; justify-content: flex-end; gap: 9px; margin-top: 22px; }
    .fixture-controls { display: flex; justify-content: flex-end; align-items: center; gap: 10px; width: fit-content; max-width: calc(100vw - 32px); margin: 16px 16px 28px auto; padding: 10px 12px; border: 1px dashed var(--control); border-radius: 12px; background: color-mix(in srgb, var(--surface) 94%, transparent); box-shadow: 0 8px 24px rgba(0,0,0,.10); color: var(--muted); }
    .fixture-tools { display: flex; align-items: center; gap: 9px; } .fixture-tools strong { color: var(--text); font-size: 12px; } .fixture-tools label { display: inline-flex; gap: 6px; align-items: center; color: var(--muted); font-size: 12px; font-weight: 500; } .fixture-tools select { width: 122px; min-height: 30px; padding: 0 7px; } .theme-toggle { display: inline-flex; border: 1px solid var(--control); border-radius: 9px; overflow: hidden; } .theme-toggle button { min-height: 30px; padding: 0 8px; border: 0; background: transparent; color: var(--muted); } .theme-toggle button[aria-pressed="true"] { background: var(--blue-soft); color: var(--blue); font-weight: 650; }
    .fixture-log { max-width: 290px; color: var(--meta); font-size: 11px; line-height: 16px; }
    @media (min-width: 1920px) { :root { --sidebar: 244px; --gutter: 48px; } main { padding-top: 32px; } .team-grid { grid-template-columns: minmax(390px,.74fr) minmax(670px,1.26fr); } .detail { min-height: 554px; } .page-head { margin-top: 38px; } .wide-only { display: block; margin-top: 20px; padding: 12px; border: 1px solid var(--line); border-radius: 9px; background: var(--surface-2); } .wide-only-grid { display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: 12px; margin-top: 7px; } .wide-only-grid b { display: block; font-size: 13px; } .wide-only-grid span { color: var(--muted); font-size: 12px; } }
    @media (max-width: 1320px) { :root { --gutter: 28px; } .team-grid { grid-template-columns: minmax(272px,.7fr) minmax(0,1.3fr); gap: 16px; } .status-pills .quiet-status:nth-child(2) { display: none; } }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { scroll-behavior: auto !important; transition: none !important; animation: none !important; } }
  </style>
</head>
<body>
  <div class="shell">
    <aside class="side" aria-label="主导航">
      <div class="brand"><span class="brand-mark">T</span>Traqen</div>
      <div class="workspace-chip"><small>Workspace</small><strong>订单平台</strong><span class="subtle">已固定的工作上下文</span></div>
      <nav class="nav-group" aria-label="工作区导航">
        <span class="nav-label">工作空间</span>
        <button class="nav-item"><svg class="nav-icon" viewBox="0 0 24 24"><path d="m4 11 8-7 8 7v9H4zM9 20v-6h6v6"/></svg>工作区概览</button>
        <span class="nav-label">理解</span>
        <button class="nav-item"><svg class="nav-icon" viewBox="0 0 24 24"><path d="M4 5h16v5H4zM4 14h16v5H4zM8 8h8M8 17h8"/></svg>来源快照</button>
        <button class="nav-item"><svg class="nav-icon" viewBox="0 0 24 24"><path d="M5 4h14v16H5zM8 8h8M8 12h8M8 16h5"/></svg>技术证据</button>
        <button class="nav-item"><svg class="nav-icon" viewBox="0 0 24 24"><circle cx="6" cy="7" r="2"/><circle cx="18" cy="7" r="2"/><circle cx="12" cy="17" r="2"/><path d="m8 8.5 2.5 6M16 8.5l-2.5 6"/></svg>业务图谱</button>
        <button class="nav-item"><svg class="nav-icon" viewBox="0 0 24 24"><path d="M5 17 10 12l3 3 6-7M15 8h4v4"/></svg>变更影响</button>
      </nav>
      <div class="side-rule" aria-hidden="true"></div>
      <section class="recent-list" data-testid="recent-viewed" aria-label="最近查看"><span class="nav-label">最近查看</span><button class="nav-item"><svg class="nav-icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><path d="M12 8v4l3 2"/></svg>订单取消规则</button><button class="nav-item"><svg class="nav-icon" viewBox="0 0 24 24"><path d="M5 4h14v16H5zM8 8h8M8 12h5"/></svg>OrderService</button></section>
      <div class="side-foot"><button class="nav-item current" aria-current="page"><svg class="nav-icon" viewBox="0 0 24 24"><path d="M12 3v3M12 18v3M4.9 4.9 7 7M17 17l2.1 2.1M3 12h3M18 12h3M4.9 19.1 7 17M17 7l2.1-2.1"/><circle cx="12" cy="12" r="4"/></svg>设置中心</button><button class="nav-item"><svg class="nav-icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M9 9a3 3 0 0 1 6 0c0 2-3 2-3 5M12 17h.01"/></svg>帮助与快捷键</button><div class="account"><span class="account-avatar">SK</span><div><strong>Sky <span>· 工作区管理员</span></strong></div></div></div>
    </aside>
    <main>
      <div class="topline" data-testid="product-toolbar"><div class="crumb"><span>订单平台</span><span>／</span><b>设置中心</b></div><div class="status-pills"><span class="quiet-status">来源 r8 · 已冻结</span><button class="btn" style="min-height:32px">搜索任何内容</button><button class="btn" style="min-height:32px" aria-label="查看最近活动">活动 2</button></div></div>
      <section id="app" aria-live="polite"></section>
    </main>
  </div>
  <aside class="fixture-controls" aria-label="设计演示控制，不属于产品壳">
    <div class="fixture-log" id="fixture-log">模拟写入证据：0 次业务写入</div>
    <div class="fixture-tools" data-testid="fixture-tools">
      <strong>设计演示数据</strong><label>场景 <select id="scene-select" aria-label="选择设计场景"></select></label>
      <span class="theme-toggle" data-testid="theme-switcher"><button type="button" data-theme-choice="light">瓷白</button><button type="button" data-theme-choice="dark">石墨</button></span>
    </div>
  </aside>
  </div>
  <dialog id="lifecycle-dialog" data-testid="lifecycle-dialog" aria-labelledby="dialog-title"><div class="dialog-inner"><span class="badge danger">影响确认</span><h2 id="dialog-title" style="margin-top:12px">停用 <span id="dialog-capability">semantic-review</span>？</h2><p>这会使 2 个 Workspace 的 3 项历史授权显示“需要处理”。已有生效版本和运行历史保留不变。</p><label style="margin-top:16px">输入能力名称以确认 <input id="confirm-name" autocomplete="off" placeholder="semantic-review"></label><div class="dialog-actions"><button class="btn" id="dialog-cancel">取消</button><button class="btn danger" id="dialog-confirm" disabled>确认停用</button></div></div></dialog>
  <dialog id="f003-dialog" aria-labelledby="f003-dialog-title"><div class="dialog-inner"><span class="badge warning">交互示意</span><h2 id="f003-dialog-title" style="margin-top:12px">尚未接入真实分析启动</h2><p>此点击只说明 F003 应在版本变化后要求确认；它不会读取材料、创建 Run 或调用旧启动 API。</p><div class="dialog-actions"><button class="btn primary" id="f003-close">知道了</button></div></div></dialog>
  <script>
    (() => {
      const scenes = {
        empty: 'S01 · 范围与初始空态', accounts: 'S02 · 账号', models: 'S03 · 模型', skills: 'S03 · Skill', team: 'S04 · 完整团队', capabilities: 'S05 · 能力管理', conflict: 'S06 · 草稿冲突', lifecycle: 'S07 · 生命周期影响', mcp: 'S08 · MCP 暂停', versions: 'S09 · 生效版本', f003: 'S10 · F003 配置确认示意'

      function versions() { return `${head('Workspace 设置 · 订单平台', '当前生效配置', '草稿已保存不等于已应用；每次运行固定读取创建时的版本。', `${scope()}<button class="btn link" data-scene="team">返回团队编辑</button>`)}${workspaceSettingsNav('team')}<section class="content versions"><section class="panel pad"><div class="section-head"><div><span class="eyebrow">当前生效</span><div class="version-number">版本 8</div><p class="subtle">今天 10:30 · cfg_01HX…9M</p></div>${pill('success','已生效')}</div><div class="key-value"><span>Main</span><b>gpt-5.6-sol · 2 项 Skill</b></div><div class="key-value"><span>Child 1</span><b>gpt-5.6-sol · 1 项 Skill</b></div><div class="key-value"><span>Child 2</span><b>gpt-5.6-sol · 1 项 Skill</b></div><div class="notice" style="margin-top:16px"><span class="dot"></span><div><strong>仅影响之后的新分析</strong><br>运行 RUN-049 继续固定使用版本 7；刷新和恢复不会换成当前 Active。</div></div></section><aside class="panel pad"><h2>草稿</h2><p class="subtle" style="margin-top:5px">已保存 · 3 项待应用更改</p><div class="timeline"><div class="event"><i></i><div><b>Child 2 模型</b><p>gpt-5.6-sol → gpt-5.6-terra</p></div></div><div class="event"><i></i><div><b>Skill 授权</b><p>新增 impact-summary；草稿合计 2 项 Skill</p></div></div></div><p class="field-help" style="margin-top:16px">这是只读版本对照。若要应用草稿，请返回团队编辑页。</p><button class="btn primary" data-scene="team" style="margin-top:12px">返回团队编辑</button></aside></section>`; }
      function f003() { return `${head('F003 · 分析准备', '确认将使用的 F006 生效配置', '这是跨 Feature 交互示意：真实材料绑定、启动 API 与持久确认机制尚未接线。', '<button class="btn primary" id="f003-confirm">确认配置并继续</button>')}<section class="content f003-grid"><section class="panel pad"><div class="section-head"><div><h2>订单取消规则的调查准备</h2><p class="subtle">首次使用或配置版本变化时，要求人工确认。</p></div>${pill('blue','版本 8')}</div><div class="checklist"><div><i>✓</i><span><b>Main · gpt-5.6-sol</b><br><span class="subtle">已固定给本次准备摘要；不是实时目录。</span></span></div><div><i>✓</i><span><b>Child 1 / Child 2</b><br><span class="subtle">模型与能力数量可见，敏感认证内容不展开。</span></span></div><div><i>✓</i><span><b>账号就绪性</b><br><span class="subtle">服务端应在真实启动前再次校验，原型不声称检查通过。</span></span></div></div></section><aside class="panel pad" data-testid="f003-fixture-only"><span class="badge warning">明确限制</span><h2 style="margin-top:12px">不是 AC-C2 完成声明</h2><p class="subtle" style="margin-top:7px">这个示意不会读取新材料、不会复活 F001 的旧入口、不会创建 Run，也不能证明 F003 接线已完成。</p><button class="btn" id="simulate-head-conflict" style="margin-top:16px">示意：配置 Head 已变化</button></aside></section>`; }
      function content() { return ({empty, accounts, models, skills, team, capabilities, conflict, lifecycle, mcp, versions, f003}[state.scene] || team)(); }
      function bind() {
        document.querySelectorAll('[data-agent]').forEach(button => button.addEventListener('click', () => { state.selected = button.dataset.agent; persist(); render(); }));
        document.querySelectorAll('[data-scene]').forEach(button => button.addEventListener('click', () => navigate(button.dataset.scene)));
        $('#agent-model')?.addEventListener('change', event => { if (state.selected === 'child-2') { state.child2Model = event.target.value.split(' · ')[0]; persist(); log('draft-save', 'Child 2 仅改变自己的草稿；Main 与其他 Workspace sentinel 未变', true); render(); } });
        $('#m3-note')?.addEventListener('input', event => { state.m3 = event.target.value; persist(); log('local-edit', 'M3 在 409 横幅期间保留为本地编辑，零额外写入', false); });
        $('#conflict-retry')?.addEventListener('click', () => { log('draft-save', 'M2 冻结快照 → 200 已确认', true); log('draft-save', 'M3 更晚编辑 → 200 恰好补存一次', true); state.conflict = false; persist(); render(); });
        $('#conflict-server')?.addEventListener('click', () => { log('recovery', '采用服务器草稿；取消本地未持久编辑，不产生业务写入', false); state.m3 = ''; persist(); render(); });
        $('[data-action=open-legacy-issue]')?.addEventListener('click', () => { state.legacyIssue = true; state.selected = 'child-1'; persist(); navigate('team'); });
        $('#revoke-legacy')?.addEventListener('click', () => { state.legacyIssue = false; log('draft-save', 'Child 1 撤销 legacy-lint 历史授权（仅演示）', true); persist(); render(); });
        $('#open-lifecycle')?.addEventListener('click', event => { state.lifecycleInvoker = event.currentTarget; $('#lifecycle-dialog').showModal(); $('#confirm-name').focus(); });
        $('#f003-confirm')?.addEventListener('click', () => $('#f003-dialog').showModal());
        $('#simulate-head-conflict')?.addEventListener('click', () => { log('f003-fixture', '只切换示意状态；没有创建 Run', false); alert('配置 Head 已变化：保留调查输入，刷新摘要后重新确认。'); });
        $('#apply')?.addEventListener('click', () => log('activation', '团队草稿 → 新版本（仅演示）', true));
      }
      function render() { $('#app').innerHTML = content(); $('#scene-select').value = state.scene; bind(); updateLog(); }
      function navigate(scene) { state.scene = scenes[scene] ? scene : 'team'; if (state.scene === 'conflict' && !state.conflictStarted) { state.conflictStarted = true; state.conflict = true; persist(); log('draft-save', 'M2 冻结快照 → 409 冲突', true); } history.replaceState(null, '', `#${state.scene}`); render(); }
      Object.entries(scenes).forEach(([key, label]) => $('#scene-select').insertAdjacentHTML('beforeend', `<option value="${key}">${label}</option>`));
      $('#scene-select').addEventListener('change', event => navigate(event.target.value));
      document.querySelectorAll('[data-theme-choice]').forEach(button => button.addEventListener('click', () => applyTheme(button.dataset.themeChoice)));
      $('#dialog-cancel').addEventListener('click', () => { $('#lifecycle-dialog').close(); log('lifecycle-cancel', '取消影响确认，零业务写入', false); setTimeout(() => $('#open-lifecycle')?.focus(), 0); });
      $('#confirm-name').addEventListener('input', event => { $('#dialog-confirm').disabled = event.target.value !== 'semantic-review'; });
      $('#dialog-confirm').addEventListener('click', () => { log('lifecycle', '确认停用 semantic-review（演示）', true); $('#lifecycle-dialog').close(); });
      $('#f003-close').addEventListener('click', () => $('#f003-dialog').close());
      $('#lifecycle-dialog').addEventListener('cancel', () => { log('lifecycle-cancel', 'Escape 关闭影响确认，零业务写入', false); setTimeout(() => $('#open-lifecycle')?.focus(), 0); });
      window.addEventListener('hashchange', () => navigate(location.hash.slice(1)));
      window.__f006UX = { state, scenes, navigate, applyTheme, log, resetLogs: () => { state.logs = []; updateLog(); }, getWriteCount: () => state.logs.filter(x => x.write).length, getBusinessLog: () => state.logs.filter(x => x.write), sentinels: state.sentinels };
      addEventListener('scroll', () => sessionStorage.setItem('traqen-f006-ux-scroll', String(scrollY)), { passive: true });
      applyTheme(state.theme); navigate(location.hash.slice(1) || 'team');
      requestAnimationFrame(() => scrollTo(0, Number(sessionStorage.getItem('traqen-f006-ux-scroll') || 0)));
    })();
  </script>
