<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1020" viewBox="0 0 1600 1020" role="img" aria-labelledby="title desc">
  <title id="title">Traqen 产品功能架构</title>
  <desc id="desc">Workspace 切换驱动所有模块，底层共享可审核证据与图谱平台。</desc>
  <defs>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#7c3aed"/></marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#2563eb"/></marker>
    <marker id="arrow-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#0f766e"/></marker>
    <style>
      text{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;fill:#1e293b}
      .h1{font-size:30px;font-weight:700}.h2{font-size:22px;font-weight:700}.body{font-size:18px}.small{font-size:16px}
      .box{stroke-width:2;rx:16}.context{stroke-width:3}.flow{stroke:#7c3aed;stroke-width:2;fill:none;marker-end:url(#arrow-purple)}
    </style>
  </defs>
  <rect width="1600" height="1020" fill="#fff"/>
  <text x="50" y="52" class="h1">Traqen 产品功能架构 · Workspace 是全局上下文</text>

  <rect x="50" y="95" width="300" height="120" class="box" fill="#dbeafe" stroke="#2563eb"/>
  <text x="200" y="140" text-anchor="middle" class="h2">Workspace Switcher</text>
  <text x="200" y="178" text-anchor="middle" class="body">新建 · 显示/隐藏 · 删除</text>
  <path d="M350 155H460" stroke="#2563eb" stroke-width="3" marker-end="url(#arrow-blue)"/>

  <rect x="460" y="95" width="660" height="120" rx="16" fill="#ede9fe" stroke="#7c3aed" class="context"/>
  <text x="790" y="140" text-anchor="middle" class="h2">CurrentWorkspaceContext</text>
  <text x="790" y="178" text-anchor="middle" class="body">workspaceId · contextVersion · CurrentGraphHead</text>

  <rect x="1210" y="95" width="330" height="120" class="box" fill="#f1f5f9" stroke="#64748b" stroke-dasharray="10 7"/>
  <text x="1375" y="133" text-anchor="middle" class="h2">Config Sources</text>
  <text x="1375" y="165" text-anchor="middle" class="body">Models · Built-ins</text>
  <text x="1375" y="190" text-anchor="middle" class="small">模型复用 · 能力只读</text>

  <path d="M600 215L265 310M700 215L675 310M830 215L1025 310M960 215L1380 310M890 215L1025 505M1010 215L1380 505" class="flow"/>
  <path d="M1375 215L1380 505" stroke="#64748b" stroke-width="2" stroke-dasharray="10 7" fill="none" marker-end="url(#arrow-purple)"/>

  <rect x="50" y="310" width="430" height="220" class="box" fill="#ccfbf1" stroke="#0f766e" stroke-width="3"/>
  <text x="265" y="352" text-anchor="middle" class="h2">F001 · Workspace 分析</text>
  <text x="265" y="395" text-anchor="middle" class="body">静态扫描 + 完整 Inventory</text>
  <text x="265" y="428" text-anchor="middle" class="body">主 Agent 规划/对账</text>
  <text x="265" y="461" text-anchor="middle" class="body">同批次子 Agent（2..N）</text>
  <text x="265" y="494" text-anchor="middle" class="body">实时进度 + Working Tree</text>

  <rect x="520" y="310" width="310" height="160" class="box" fill="#dbeafe" stroke="#1d4ed8"/>
  <text x="675" y="352" text-anchor="middle" class="h2">F002 · 功能/API 追溯</text>
  <text x="675" y="392" text-anchor="middle" class="body">最新树 · 缺口</text>
  <text x="675" y="425" text-anchor="middle" class="body">Feature 历史版本</text>

  <rect x="870" y="310" width="310" height="160" class="box" fill="#f3e8ff" stroke="#7e22ce"/>
  <text x="1025" y="352" text-anchor="middle" class="h2">F003 · 追溯图谱</text>
  <text x="1025" y="392" text-anchor="middle" class="body">Feature/API 入口</text>
  <text x="1025" y="425" text-anchor="middle" class="body">证据路径探索</text>

  <rect x="1220" y="310" width="320" height="160" class="box" fill="#fef3c7" stroke="#b45309"/>
  <text x="1380" y="352" text-anchor="middle" class="h2">F004 · 声明审核</text>
  <text x="1380" y="392" text-anchor="middle" class="body">证据不足 · 批量审核</text>
  <text x="1380" y="425" text-anchor="middle" class="body">编辑自动准入结果</text>

  <rect x="870" y="505" width="310" height="145" class="box" fill="#ffe4e6" stroke="#be123c"/>
  <text x="1025" y="548" text-anchor="middle" class="h2">F005 · 变更影响</text>
  <text x="1025" y="586" text-anchor="middle" class="body">增量变化路径</text>
  <text x="1025" y="618" text-anchor="middle" class="body">受影响项 · 重验证</text>

  <rect x="1220" y="505" width="320" height="145" class="box" fill="#e2e8f0" stroke="#475569"/>
  <text x="1380" y="548" text-anchor="middle" class="h2">F006 · Workspace 设置</text>
  <text x="1380" y="578" text-anchor="middle" class="small">Main + Child 2..N · 模型</text>
  <text x="1380" y="608" text-anchor="middle" class="small">Skill/MCP 项目覆盖 + 禁用</text>
  <text x="1380" y="636" text-anchor="middle" class="small">不可变 Run Profile</text>

  <path d="M265 530V710" stroke="#0f766e" stroke-width="3" marker-end="url(#arrow-teal)"/>
  <rect x="50" y="710" width="1490" height="260" class="box" fill="#f8fafc" stroke="#334155" stroke-width="3"/>
  <text x="82" y="755" class="h2">Canonical Evidence &amp; Graph Platform · 所有节点按 workspaceId 隔离</text>
  <text x="795" y="825" text-anchor="middle" class="h2">SourceSnapshot / Inventory → Facts + Child Results → Reconciled Candidates / Ledgers</text>
  <text x="795" y="885" text-anchor="middle" class="h2">→ Human Review &amp; Decision → Evaluated GraphRevision → CurrentGraphHead</text>
  <text x="795" y="930" text-anchor="middle" class="body">默认最新投影 · Feature 历史 · ChangeSet · Impact · Test / Result Evidence</text>
</svg>
